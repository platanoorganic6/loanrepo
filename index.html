document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

s-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<script src=\"42663d1d-22c4-4cbe-afb2-2395ddb0226b\"><\u002Fscript>\n<script src=\"60b3ba6b-3787-4aa8-8f11-c2b3394ba8d6\"><\u002Fscript>\n<script src=\"4544f498-1beb-4e2e-bb3a-8f10c88b0d61\"><\u002Fscript>\n<script src=\"ed5cf73f-0440-4f0d-927e-170e1d7aeaae\"><\u002Fscript>\n<script src=\"4de45bca-b4cb-4994-8fcf-d9f0fda45b03\"><\u002Fscript>\n<style>\n  /* Barlow's latin subset carries no U+20B9 (₹) and this app is nothing but\n     rupee figures, so load the glyph from Noto Sans and keep it in both of the\n     design system's font stacks. Kept here rather than in the system's own\n     stylesheet so upstream retunes still reach this page. */\n  @font-face {\n  font-family: 'Noto Sans';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2104170d-b0a1-4e15-b31b-4a1ac07ac696\") format('woff2');\n  unicode-range: U+20b9;\n}\n@font-face {\n  font-family: 'Noto Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"2104170d-b0a1-4e15-b31b-4a1ac07ac696\") format('woff2');\n  unicode-range: U+20b9;\n}\n\n  :root {\n    --font-heading: \"Barlow Condensed\", \"Noto Sans\", system-ui, sans-serif;\n    --font-body: \"Barlow\", \"Noto Sans\", system-ui, sans-serif;\n  }\n  body { margin: 0; }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent-900); text-decoration: underline; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"min-height:100vh; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body);\">\n\n  <header style=\"border-bottom:1px solid var(--color-divider);\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:16px 24px; flex-wrap:wrap; min-height:62px;\">\n      <div style=\"font-family:var(--font-heading); font-weight:600; font-size:21px; letter-spacing:0.01em; margin-right:auto;\">LOAN<span style=\"color:var(--color-accent-700);\">REPO<\u002Fspan><\u002Fdiv>\n      <nav style=\"display:flex; gap:14px 20px; flex-wrap:wrap;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goLoan }}\" style=\"background:none; border:none; padding:8px 0; cursor:pointer; font-family:var(--font-heading); font-weight:600; font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text); border-bottom:2px solid {{ navLoan }};\">Your loan<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goBuying }}\" style=\"background:none; border:none; padding:8px 0; cursor:pointer; font-family:var(--font-heading); font-weight:600; font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text); border-bottom:2px solid {{ navBuying }};\">Buying soon<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goCycle }}\" style=\"background:none; border:none; padding:8px 0; cursor:pointer; font-family:var(--font-heading); font-weight:600; font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text); border-bottom:2px solid {{ navCycle }};\">Rate cycle<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ goExamples }}\" style=\"background:none; border:none; padding:8px 0; cursor:pointer; font-family:var(--font-heading); font-weight:600; font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text); border-bottom:2px solid {{ navExamples }};\">Examples<\u002Fbutton>\n        <sc-if value=\"{{ dbEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ goSaved }}\" style=\"background:none; border:none; padding:8px 0; cursor:pointer; font-family:var(--font-heading); font-weight:600; font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text); border-bottom:2px solid {{ navSaved }};\">Saved runs<\u002Fbutton>\n        <\u002Fsc-if>\n        <button type=\"button\" sc-camel-on-click=\"{{ goMethod }}\" style=\"background:none; border:none; padding:8px 0; cursor:pointer; font-family:var(--font-heading); font-weight:600; font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text); border-bottom:2px solid {{ navMethod }};\">Method<\u002Fbutton>\n      <\u002Fnav>\n      <sc-if value=\"{{ dbEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; align-items:center; gap:12px; padding-left:8px; border-left:1px solid var(--color-divider);\">\n          <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:12.5px; color:var(--color-neutral-700); max-width:22ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ userEmail }}<\u002Fspan>\n            <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ signOut }}\" style=\"font-size:12px;\">Sign out<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ signedOut }}\" hint-placeholder-val=\"{{ true }}\">\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ openAuth }}\" style=\"font-size:12px;\">Sign in<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ authOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"dialog-backdrop\" style=\"z-index:50;\">\n    <div class=\"dialog blueprint\" style=\"background:var(--color-bg);\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div class=\"dialog-title\">Sign in to save your runs<\u002Fdiv>\n      <div class=\"dialog-body\">An account only stores the loan particulars you choose to save. It is not required to use the calculator.<\u002Fdiv>\n      <button type=\"button\" class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ signInGoogle }}\">Continue with Google<\u002Fbutton>\n      <div style=\"display:flex; align-items:center; gap:12px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-neutral-600); margin:2px 0;\">\n        <span style=\"flex:1; height:1px; background:var(--color-divider);\"><\u002Fspan>or<span style=\"flex:1; height:1px; background:var(--color-divider);\"><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"field\"><label for=\"lr-email\">Email a sign-in link<\u002Flabel><input class=\"input\" id=\"lr-email\" type=\"email\" placeholder=\"you@example.com\" value=\"{{ fEmail }}\" sc-camel-on-change=\"{{ setEmail }}\"><\u002Fdiv>\n      <div style=\"font-size:12.5px; color:var(--color-neutral-700); min-height:18px;\">{{ authMsg }}<\u002Fdiv>\n      <div class=\"dialog-actions\">\n        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ closeAuth }}\">Cancel<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ signInEmail }}\">Send link<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ══ SCREEN: YOUR LOAN ══ -->\n  <sc-if value=\"{{ onLoan }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:clamp(28px,5vw,44px) clamp(16px,4vw,24px) 88px;\">\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:56px; align-items:start;\">\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:12px;\">Loan journey · sourced from RBI MPC records<\u002Fdiv>\n        <h1 style=\"font-size:clamp(30px,6vw,46px); line-height:1.04; margin:0 0 18px; max-width:20ch;\">Your bank never told you this changed.<\u002Fh1>\n        <p style=\"font-size:16px; line-height:1.6; max-width:52ch; color:var(--color-neutral-800); margin:0 0 12px;\">Enter the month you took the loan. We walk it through every actual repo rate change since — reset by reset, month by month — and show where your tenure and balance really landed.<\u002Fp>\n        <p style=\"font-size:14px; line-height:1.6; max-width:52ch; color:var(--color-neutral-700); margin:0;\">The calculation runs in your browser. Your particulars are saved only if you sign in and choose to save a run — and only you can read them back. No lender affiliation, no commission on what you decide.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"blueprint\" style=\"padding:22px 24px 24px;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-neutral-700); padding-bottom:16px; border-bottom:1px dashed var(--color-divider); margin-bottom:20px;\">Loan particulars<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:16px;\">\n          <div class=\"field\"><label for=\"lr-date\">Loan start month<\u002Flabel><input class=\"input\" id=\"lr-date\" type=\"month\" min=\"2019-01\" max=\"2026-08\" value=\"{{ fDate }}\" sc-camel-on-change=\"{{ setDate }}\"><\u002Fdiv>\n          <div class=\"field\"><label for=\"lr-ten\">Original tenure (years)<\u002Flabel><input class=\"input\" id=\"lr-ten\" type=\"number\" min=\"1\" max=\"30\" step=\"1\" value=\"{{ fTenure }}\" sc-camel-on-change=\"{{ setTenure }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-top:16px;\"><label for=\"lr-amt\">Loan amount (₹)<\u002Flabel><input class=\"input\" id=\"lr-amt\" type=\"number\" min=\"100000\" step=\"50000\" value=\"{{ fAmount }}\" sc-camel-on-change=\"{{ setAmount }}\"><\u002Fdiv>\n        <div style=\"margin-top:20px;\">\n          <label style=\"display:block; font-size:12px; margin-bottom:7px; color:var(--color-neutral-700);\">Which benchmark is your loan on?<\u002Flabel>\n          <div class=\"seg\">\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"bm\" value=\"EBLR\" checked=\"{{ isEblr }}\" sc-camel-on-change=\"{{ setBenchmark }}\">EBLR / RLLR<\u002Flabel>\n            <label class=\"seg-opt\"><input type=\"radio\" name=\"bm\" value=\"MCLR\" checked=\"{{ isMclr }}\" sc-camel-on-change=\"{{ setBenchmark }}\">MCLR<\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"font-size:12px; line-height:1.5; color:var(--color-neutral-700); margin-top:9px;\">Check your sanction letter. The two reset on very different schedules, so this changes the result meaningfully.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px; border-top:1px dashed var(--color-divider); padding-top:16px;\">\n          <label style=\"display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:13px; line-height:1.45;\">\n            <input type=\"checkbox\" checked=\"{{ useOwnSpread }}\" sc-camel-on-change=\"{{ setUseOwnSpread }}\" style=\"margin-top:3px;\">\n            <span>I know my spread over the benchmark<span style=\"display:block; color:var(--color-neutral-700); font-size:12px; margin-top:2px;\">It's in your sanction letter. This is the biggest source of error in the result — a quarter point moves a 20-year loan by about a year.<\u002Fspan><\u002Fspan>\n          <\u002Flabel>\n          <sc-if value=\"{{ useOwnSpread }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"field\" style=\"margin-top:12px;\"><label for=\"lr-spread\">Your spread (%)<\u002Flabel><input class=\"input\" id=\"lr-spread\" type=\"number\" step=\"0.01\" min=\"0.5\" max=\"8\" placeholder=\"2.65\" value=\"{{ ownSpread }}\" sc-camel-on-change=\"{{ setOwnSpread }}\"><\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:7px;\">{{ spreadHint }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button type=\"button\" class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ run }}\" style=\"width:100%; margin-top:24px; padding:13px; font-size:15px; letter-spacing:0.06em; text-transform:uppercase;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          Run your loan journey\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasResult }}\" hint-placeholder-val=\"{{ true }}\">\n    <div ref=\"{{ resultRef }}\" style=\"margin-top:64px; border-top:1px solid var(--color-text); padding-top:0; scroll-margin-top:16px;\">\n\n      <!-- verdict -->\n      <sc-if value=\"{{ isLeak }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:var(--color-accent-900); color:var(--color-bg); padding:clamp(24px,4vw,40px); display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:44px; align-items:end;\">\n        <div>\n          <div style=\"font-family:var(--font-heading); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; opacity:0.7; margin-bottom:10px;\">Added to your loan, unannounced<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-weight:600; font-size:clamp(56px,12vw,86px); line-height:0.9; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;\">+{{ leakYears }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-size:20px; letter-spacing:0.04em; text-transform:uppercase; margin-top:8px;\">years of tenure<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding-bottom:6px;\">\n          <p style=\"font-size:17px; line-height:1.55; margin:0 0 14px; max-width:46ch;\">Your EMI never moved. The rate did — from <b>{{ startRate }}%<\u002Fb> at disbursal to <b>{{ nowRate }}%<\u002Fb> today — so the bank stretched the term instead. A {{ fTenure }}-year loan is now a ~{{ totalYears }}-year one, and no statement ever said so in those words.<\u002Fp>\n          <div style=\"border-top:1px solid rgba(242,242,243,0.3); padding-top:14px; font-size:15px; line-height:1.5; max-width:46ch;\">That is <b>{{ extraCashTxt }}<\u002Fb> in extra lifetime payments — the same damage as overpaying about <b>{{ overpayPct }}%<\u002Fb> on the property itself.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAhead }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"blueprint\" style=\"padding:40px; margin-top:6px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:44px; align-items:end;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div>\n          <div style=\"font-family:var(--font-heading); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:10px;\">Ahead of your original schedule<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-weight:600; font-size:clamp(56px,12vw,86px); line-height:0.9; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; color:var(--color-accent-800);\">−{{ aheadYears }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-size:20px; letter-spacing:0.04em; text-transform:uppercase; margin-top:8px;\">years of tenure<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding-bottom:6px;\">\n          <p style=\"font-size:17px; line-height:1.55; margin:0; max-width:46ch;\">Rates fell after you borrowed — from <b>{{ startRate }}%<\u002Fb> at disbursal to <b>{{ nowRate }}%<\u002Fb> today. On the same EMI, your loan is clearing early rather than stretching. You bought on the right side of the cycle.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- spec sheet -->\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); border-bottom:1px solid var(--color-divider);\">\n        <div style=\"padding:22px 20px 20px; border-right:1px solid var(--color-divider);\">\n          <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">EMI, then and now<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-size:26px; font-variant-numeric:tabular-nums;\">{{ emiTxt }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:3px;\">unchanged since disbursal<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 20px 20px; border-right:1px solid var(--color-divider);\">\n          <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">Effective rate today<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-size:26px; font-variant-numeric:tabular-nums;\">{{ nowRate }}%<\u002Fdiv>\n          <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:3px;\">repo {{ nowRepo }}% + {{ spreadTxt }}% spread<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 20px 20px; border-right:1px solid var(--color-divider);\">\n          <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">Outstanding now<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-size:26px; font-variant-numeric:tabular-nums;\">{{ balTxt }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:3px;\">after {{ paidMonths }} payments<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 20px 20px; border-right:1px solid var(--color-divider);\">\n          <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">Promised balance<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-size:26px; font-variant-numeric:tabular-nums;\">{{ promisedBalTxt }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:3px;\">had the rate held at {{ startRate }}%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:22px 20px 20px;\">\n          <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">Last payment lands<\u002Fdiv>\n          <div style=\"font-family:var(--font-heading); font-size:26px; font-variant-numeric:tabular-nums;\">{{ payoffTxt }}<\u002Fdiv>\n          <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:3px;\">original schedule said {{ promisedEndTxt }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- the one shareable image -->\n      <sc-if value=\"{{ isLeak }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:44px;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:14px;\">\n          <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase;\">The loan you signed, against the loan you have<\u002Fdiv>\n          <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ copyShare }}\" style=\"font-size:12px;\">{{ shareCta }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div id=\"lr-share\" style=\"background:var(--color-accent-900); color:var(--color-bg); padding:30px 34px;\">\n          <div style=\"display:grid; gap:20px;\">\n            <div>\n              <div style=\"display:flex; justify-content:space-between; font-size:13px; margin-bottom:7px; opacity:0.8;\"><span>Contracted<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;\">{{ fTenure }} years<\u002Fspan><\u002Fdiv>\n              <div style=\"height:26px; background:rgba(242,242,243,0.22); position:relative;\">\n                <div style=\"position:absolute; inset:0 auto 0 0; width:{{ barPromised }}%; background:rgba(242,242,243,0.55);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"display:flex; justify-content:space-between; font-size:13px; margin-bottom:7px;\"><span>Actual, after every rate reset<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;\">{{ totalYearsExact }} years<\u002Fspan><\u002Fdiv>\n              <div style=\"height:26px; background:rgba(242,242,243,0.22); position:relative;\">\n                <div style=\"position:absolute; inset:0 auto 0 0; width:{{ barActual }}%; background:var(--color-bg);\"><\u002Fdiv>\n                <div style=\"position:absolute; top:0; bottom:0; left:{{ barPromised }}%; width:{{ barGap }}%; background:repeating-linear-gradient(135deg, rgba(242,242,243,0.9) 0 2px, transparent 2px 7px);\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; border-top:1px solid rgba(242,242,243,0.3); margin-top:24px; padding-top:18px;\">\n            <div style=\"font-size:14px; line-height:1.5; max-width:42ch;\">Same EMI throughout. The hatched band is what the rate cycle added without a conversation.<\u002Fdiv>\n            <div style=\"text-align:right;\">\n              <div style=\"font-family:var(--font-heading); font-size:42px; line-height:1; font-variant-numeric:tabular-nums;\">+{{ leakYears }} yrs<\u002Fdiv>\n              <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.12em; text-transform:uppercase; opacity:0.7; margin-top:6px;\">loanrepo · rbi mpc records<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- chart -->\n      <figure class=\"blueprint\" style=\"margin-top:44px; padding:26px 26px 18px;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:16px; margin-bottom:18px;\">\n          <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase;\">Balance: what you were promised vs. what happened<\u002Fdiv>\n          <div style=\"display:flex; gap:20px; font-size:12px; color:var(--color-neutral-700);\">\n            <span style=\"display:flex; align-items:center; gap:7px;\"><span style=\"width:22px; height:0; border-top:2px dashed var(--color-neutral-500);\"><\u002Fspan>Promised at {{ startRate }}%<\u002Fspan>\n            <span style=\"display:flex; align-items:center; gap:7px;\"><span style=\"width:22px; height:0; border-top:2px solid var(--color-accent-700);\"><\u002Fspan>Actual, floating<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:62px minmax(0,1fr); align-items:stretch;\">\n          <div style=\"position:relative; font-size:11px; color:var(--color-neutral-700); font-variant-numeric:tabular-nums; text-align:right; padding-right:9px;\">\n            <span style=\"position:absolute; right:9px; top:7.8%; transform:translateY(-50%);\">{{ yTop }}<\u002Fspan>\n            <span style=\"position:absolute; right:9px; top:50.4%; transform:translateY(-50%);\">{{ yMid }}<\u002Fspan>\n            <span style=\"position:absolute; right:9px; top:93%; transform:translateY(-50%);\">0<\u002Fspan>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 858 212\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"Loan balance over time, promised versus actual\">\n            <g stroke=\"var(--color-divider)\" stroke-width=\"1\">\n              <line x1=\"0\" y1=\"16\" x2=\"0\" y2=\"196\"><\u002Fline>\n              <line x1=\"0\" y1=\"196\" x2=\"858\" y2=\"196\"><\u002Fline>\n              <line x1=\"0\" y1=\"106\" x2=\"858\" y2=\"106\" stroke-dasharray=\"2 5\"><\u002Fline>\n            <\u002Fg>\n            <polyline fill=\"none\" stroke=\"var(--color-neutral-500)\" stroke-width=\"1.75\" stroke-dasharray=\"5 4\" points=\"{{ chartPromised }}\"><\u002Fpolyline>\n            <polyline fill=\"none\" stroke=\"var(--color-accent-700)\" stroke-width=\"2.25\" points=\"{{ chartActual }}\"><\u002Fpolyline>\n            <line x1=\"{{ xToday }}\" y1=\"16\" x2=\"{{ xToday }}\" y2=\"196\" stroke=\"var(--color-text)\" stroke-width=\"1\"><\u002Fline>\n            <circle cx=\"{{ xToday }}\" cy=\"{{ yToday }}\" r=\"3.5\" fill=\"var(--color-text)\"><\u002Fcircle>\n            <text x=\"{{ xTodayLabel }}\" y=\"12\" font-family=\"Barlow Condensed, Noto Sans, system-ui\" font-size=\"12\" fill=\"var(--color-text)\" letter-spacing=\"0.08em\">TODAY<\u002Ftext>\n          <\u002Fsvg>\n          <div><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; gap:12px; font-family:var(--font-heading); font-size:12px; letter-spacing:0.08em; margin-top:6px;\">\n            <span>{{ startLabel }}<\u002Fspan>\n            <span>{{ endLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <figcaption style=\"font-size:12px; color:var(--color-neutral-700); margin-top:10px;\">The gap between the two lines at today's marker is the part of your loan the rate cycle took back. Beyond the marker, the actual line assumes the repo rate holds at {{ nowRepo }}%.<\u002Ffigcaption>\n      <\u002Ffigure>\n\n      <!-- reset timeline -->\n      <div style=\"margin-top:52px;\">\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:4px;\">Every reset that moved your rate<\u002Fdiv>\n        <p style=\"font-size:14px; color:var(--color-neutral-700); max-width:64ch; margin:0 0 18px;\">Each row is a real RBI decision reaching your loan at its next reset date. Your EMI is the same on every line.<\u002Fp>\n        <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n          <sc-raw-thead>\n            <sc-raw-tr><sc-raw-th>Reset date<\u002Fsc-raw-th><sc-raw-th>Month<\u002Fsc-raw-th><sc-raw-th>Rate change<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Balance that month<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Interest in that EMI<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ resets }}\" as=\"row\" hint-placeholder-count=\"6\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums; white-space:nowrap;\">{{ row.date }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"color:var(--color-neutral-700); font-variant-numeric:tabular-nums;\">{{ row.month }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums;\"><span style=\"color:var(--color-neutral-600);\">{{ row.from }}%<\u002Fspan> → <b>{{ row.to }}%<\u002Fb> <span style=\"font-size:12px; color:var(--color-accent-700);\">{{ row.delta }}<\u002Fspan><\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ row.bal }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums; color:var(--color-neutral-700);\">{{ row.interest }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:10px;\">{{ resetNote }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- scenarios -->\n      <sc-if value=\"{{ showScenario }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:56px;\">\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px;\">Routes to closing this loan<\u002Fdiv>\n        <p style=\"font-size:14px; color:var(--color-neutral-700); max-width:70ch; margin:0 0 20px;\">Five ways the same loan can end, and the arithmetic for each. Deliberately unranked: which of these is right depends on what else your money could do, your tax position and your job security — none of which we know, and none of which we'll guess at.<\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-bottom:24px;\">\n          <div class=\"field\"><label for=\"lr-lump\">One-off lump sum today (₹)<\u002Flabel><input class=\"input\" id=\"lr-lump\" type=\"number\" min=\"0\" step=\"50000\" value=\"{{ fLump }}\" sc-camel-on-change=\"{{ setLump }}\"><\u002Fdiv>\n          <div class=\"field\"><label for=\"lr-extra\">Extra added to every EMI (₹)<\u002Flabel><input class=\"input\" id=\"lr-extra\" type=\"number\" min=\"0\" step=\"1000\" value=\"{{ fExtra }}\" sc-camel-on-change=\"{{ setExtra }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Route<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Monthly outgo<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Loan clears<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Years vs today<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Total still to pay<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ routes }}\" as=\"rt\" hint-placeholder-count=\"5\">\n              <sc-raw-tr>\n                <sc-raw-td><span style=\"font-size:15px;\">{{ rt.name }}<\u002Fspan><span style=\"display:block; font-size:12.5px; color:var(--color-neutral-700);\">{{ rt.note }}<\u002Fspan><\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ rt.outgo }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ rt.clears }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums; font-family:var(--font-heading); font-size:17px;\">{{ rt.delta }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ rt.total }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"font-size:12.5px; color:var(--color-neutral-700); margin-top:12px; max-width:78ch;\">Every row assumes the repo rate holds at {{ nowRepo }}% from today. \"Total still to pay\" counts everything leaving your account from now until the loan closes, lump sum included, undiscounted — so it understates the real cost of paying early and overstates the cost of paying slowly.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:48px; display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:36px; align-items:start;\">\n\n        <sc-if value=\"{{ showChecklist }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px;\">Ask your bank these five things<\u002Fdiv>\n          <p style=\"font-size:13px; color:var(--color-neutral-700); margin:0 0 4px;\">Written to be read out on a call. Every answer is something they are required to have.<\u002Fp>\n          <ol style=\"margin:0; padding:0; list-style:none; counter-reset:q;\">\n            <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"5\">\n              <li style=\"display:grid; grid-template-columns:34px minmax(0,1fr); gap:14px; padding:16px 0; border-top:1px solid var(--color-divider);\">\n                <span style=\"font-family:var(--font-heading); font-size:15px; color:var(--color-accent-700); font-variant-numeric:tabular-nums;\">{{ q.n }}<\u002Fspan>\n                <span><span style=\"font-size:15px; line-height:1.5;\">{{ q.ask }}<\u002Fspan><span style=\"display:block; font-size:13px; color:var(--color-neutral-700); margin-top:4px;\">{{ q.why }}<\u002Fspan><\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- next reset: the moment that actually matters to this loan -->\n      <div style=\"margin-top:56px; display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:36px; align-items:start;\">\n        <div class=\"blueprint\" style=\"padding:26px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px;\">Your next reset<\u002Fdiv>\n          <p style=\"font-size:13px; color:var(--color-neutral-700); margin:0 0 20px;\">Rate decisions are national; the date one reaches your loan is yours alone. This is the day to look at your statement — not the day the news breaks.<\u002Fp>\n          <div style=\"display:grid; gap:16px;\">\n            <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline; border-top:1px dashed var(--color-divider); padding-top:14px;\">\n              <span style=\"font-size:13px; color:var(--color-neutral-700);\">Falls on or about<\u002Fspan>\n              <span style=\"font-family:var(--font-heading); font-size:24px; font-variant-numeric:tabular-nums;\">{{ nextReset }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline;\">\n              <span style=\"font-size:13px; color:var(--color-neutral-700);\">Resets on a {{ resetCycle }} cycle<\u002Fspan>\n              <span style=\"font-family:var(--font-heading); font-size:24px; font-variant-numeric:tabular-nums;\">{{ resetsSoFar }} so far<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px; line-height:1.55; color:var(--color-neutral-700); margin-top:18px; border-top:1px solid var(--color-divider); padding-top:14px;\">What to check that week: whether the effective rate on your statement moved, and whether your remaining tenure moved with it. If the EMI is unchanged and the term grew, that is the mechanism on this page, happening again.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px;\">A message you can send your bank<\u002Fdiv>\n          <p style=\"font-size:13px; color:var(--color-neutral-700); margin:0 0 14px;\">Your figures, already filled in. Every answer it asks for is something your bank is required to hold.<\u002Fp>\n          <textarea class=\"input\" sc-camel-read-only=\"{{ true }}\" rows=\"14\" style=\"font-size:13px; line-height:1.6; resize:vertical;\" value=\"{{ draft }}\"><\u002Ftextarea>\n          <div style=\"display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap;\">\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ copyDraft }}\">Copy the message<\u002Fbutton>\n            <span style=\"font-size:12px; color:var(--color-accent-800);\">{{ copyMsg }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:48px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; border-top:1px solid var(--color-divider); padding-top:26px;\">\n        <sc-if value=\"{{ dbEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveRun }}\">Track this loan<\u002Fbutton>\n          <span style=\"font-size:12px; color:var(--color-accent-800);\">{{ saveMsg }}<\u002Fspan>\n        <\u002Fsc-if>\n        <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ print }}\">Save this result as PDF<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ goMethod }}\">Read the method and assumptions<\u002Fbutton>\n        <span style=\"font-size:12px; color:var(--color-neutral-700); max-width:44ch;\">{{ confidence }}<\u002Fspan>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ SCREEN: BUYING SOON ══ -->\n  <sc-if value=\"{{ onBuying }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:clamp(28px,5vw,44px) clamp(16px,4vw,24px) 88px;\">\n    <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:12px;\">Before you sign<\u002Fdiv>\n    <h1 style=\"font-size:clamp(28px,5.5vw,42px); line-height:1.06; margin:0 0 16px; max-width:26ch;\">Two decisions you make once, and live with for twenty years.<\u002Fh1>\n    <p style=\"font-size:16px; line-height:1.6; max-width:68ch; color:var(--color-neutral-800); margin:0 0 34px;\">Nobody can tell you where rates go next, and anyone who does is selling something. What can be shown is the range — what the same loan looks like if rates rise, hold, or fall by as much as they actually have in the last six years. And the benchmark you pick at signing, which most people never think about, is worth more than the rate you negotiate.<\u002Fp>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-bottom:34px;\">\n      <div class=\"field\"><label for=\"bs-amt\">Loan you'd take (₹)<\u002Flabel><input class=\"input\" id=\"bs-amt\" type=\"number\" min=\"500000\" step=\"100000\" value=\"{{ buyAmount }}\" sc-camel-on-change=\"{{ setBuyAmount }}\"><\u002Fdiv>\n      <div class=\"field\"><label for=\"bs-ten\">Tenure (years)<\u002Flabel><input class=\"input\" id=\"bs-ten\" type=\"number\" min=\"5\" max=\"30\" step=\"1\" value=\"{{ buyTenure }}\" sc-camel-on-change=\"{{ setBuyTenure }}\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px;\">If you borrow today at {{ buyRate }}%<\u002Fdiv>\n    <p style=\"font-size:14px; color:var(--color-neutral-700); max-width:70ch; margin:0 0 18px;\">Your EMI is fixed at signing and will not change. What changes is how long you pay it. Each row is a rate path the repo rate has actually taken at some point since 2020, applied from today.<\u002Fp>\n    <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n      <sc-raw-thead><sc-raw-tr><sc-raw-th>If the repo rate<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Your rate settles at<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">EMI<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">You actually pay for<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Total paid<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ buyScenarios }}\" as=\"bs\" hint-placeholder-count=\"4\">\n          <sc-raw-tr>\n            <sc-raw-td><span style=\"font-size:15px;\">{{ bs.name }}<\u002Fspan><span style=\"display:block; font-size:12.5px; color:var(--color-neutral-700);\">{{ bs.note }}<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ bs.rate }}%<\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ bs.emi }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums; font-family:var(--font-heading); font-size:17px;\">{{ bs.years }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ bs.total }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n    <div style=\"font-size:12.5px; color:var(--color-neutral-700); margin-top:12px; max-width:74ch;\">Modelled on a {{ buySpreadTxt }}% spread over the repo rate, EBLR, resetting quarterly. The spread is the part you negotiate; the rest is not yours to control.<\u002Fdiv>\n\n    <div style=\"margin-top:56px; display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:40px; align-items:start;\">\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px;\">The benchmark question<\u002Fdiv>\n        <h2 style=\"font-size:30px; margin:0 0 14px; max-width:22ch;\">EBLR or MCLR is a real choice, and only one of them passes cuts on.<\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.6; color:var(--color-neutral-800); margin:0 0 16px;\">EBLR is tied directly to the RBI repo rate and must reset at least quarterly. MCLR is set internally by your bank on its own cost of funds, resets annually, and moves down slowly when the RBI cuts. About 36% of floating-rate loans nationally are still on MCLR.<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.6; color:var(--color-neutral-800); margin:0;\">You can ask for EBLR at signing. You can also switch later, usually for a conversion fee — but a year on the wrong benchmark during a cutting cycle costs more than the fee. Ask which one the sanction letter puts you on before you sign it, not after.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"padding:26px;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:16px;\">Same loan, both benchmarks, from today<\u002Fdiv>\n        <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th><\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">EBLR<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">MCLR<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>Resets<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">quarterly<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">annually<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Tied to<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">RBI repo<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">bank's own cost<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Rate today<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ eblrToday }}%<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ mclrToday }}%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>EMI on this loan<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ eblrEmi }}<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ mclrEmi }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.55; color:var(--color-neutral-700); margin-top:14px;\">MCLR figures use a typical spread; your bank's own MCLR is set internally and is not published as a formula. That opacity is the point of the comparison.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:48px; border-top:1px solid var(--color-divider); padding-top:24px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;\">\n      <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goCycle }}\">See where the cycle stands today<\u002Fbutton>\n      <span style=\"font-size:12.5px; color:var(--color-neutral-700); max-width:52ch;\">We have no view on whether you should buy now or wait, and no lender relationship that would benefit from either.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ SCREEN: RATE CYCLE ══ -->\n  <sc-if value=\"{{ onCycle }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:clamp(28px,5vw,44px) clamp(16px,4vw,24px) 88px;\">\n    <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:12px;\">Where the cycle stands<\u002Fdiv>\n    <h1 style=\"font-size:clamp(28px,5.5vw,42px); line-height:1.06; margin:0 0 16px; max-width:26ch;\">The repo rate sits {{ cyclePctTxt }} of the way up its own six-year range.<\u002Fh1>\n    <p style=\"font-size:16px; line-height:1.6; max-width:66ch; color:var(--color-neutral-800); margin:0;\">This is a position, not a recommendation. Today's repo rate is <b>{{ nowRepo }}%<\u002Fb>, against a 2020–2026 floor of 4.00% and a peak of 6.50%. What that means for you depends on whether you already hold a floating loan or are deciding when to take one.<\u002Fp>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); margin-top:36px; border-top:1px solid var(--color-text); border-bottom:1px solid var(--color-divider);\">\n      <div style=\"padding:22px 20px; border-right:1px solid var(--color-divider);\">\n        <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">Today<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading); font-size:clamp(24px,4vw,30px); font-variant-numeric:tabular-nums;\">{{ nowRepo }}%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:22px 20px; border-right:1px solid var(--color-divider);\">\n        <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">Cycle floor<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading); font-size:30px; font-variant-numeric:tabular-nums;\">4.00%<\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:3px;\">May 2020 — held two years<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:22px 20px; border-right:1px solid var(--color-divider);\">\n        <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">Cycle peak<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading); font-size:30px; font-variant-numeric:tabular-nums;\">6.50%<\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:3px;\">Feb 2023 — held two years<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:22px 20px;\">\n        <div style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-600); margin-bottom:7px;\">Fastest move<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading); font-size:30px; font-variant-numeric:tabular-nums;\">250 bps<\u002Fdiv>\n        <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:3px;\">in nine months, 2022<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <figure class=\"blueprint\" style=\"margin-top:44px; padding:26px 26px 18px;\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:18px;\">RBI repo rate, Feb 2020 – Sep 2026<\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 920 250\" width=\"100%\" height=\"auto\" role=\"img\" aria-label=\"RBI repo rate 2020 to 2026\">\n        <g stroke=\"var(--color-divider)\" stroke-width=\"1\">\n          <line x1=\"62\" y1=\"18\" x2=\"62\" y2=\"214\"><\u002Fline>\n          <line x1=\"62\" y1=\"214\" x2=\"906\" y2=\"214\"><\u002Fline>\n          <line x1=\"62\" y1=\"18\" x2=\"906\" y2=\"18\" stroke-dasharray=\"2 5\"><\u002Fline>\n          <line x1=\"62\" y1=\"116\" x2=\"906\" y2=\"116\" stroke-dasharray=\"2 5\"><\u002Fline>\n        <\u002Fg>\n        <g font-family=\"Barlow, Noto Sans, system-ui\" font-size=\"11\" fill=\"var(--color-neutral-700)\" style=\"font-variant-numeric:tabular-nums;\">\n          <text x=\"18\" y=\"22\">6.50%<\u002Ftext>\n          <text x=\"18\" y=\"120\">5.25%<\u002Ftext>\n          <text x=\"18\" y=\"218\">4.00%<\u002Ftext>\n        <\u002Fg>\n        <polyline fill=\"none\" stroke=\"var(--color-accent-700)\" stroke-width=\"2.25\" points=\"{{ repoLine }}\"><\u002Fpolyline>\n        <circle cx=\"906\" cy=\"{{ repoNowY }}\" r=\"4\" fill=\"var(--color-text)\"><\u002Fcircle>\n        <g font-family=\"Barlow Condensed, Noto Sans, system-ui\" font-size=\"12\" fill=\"var(--color-text)\" letter-spacing=\"0.08em\">\n          <text x=\"62\" y=\"234\">FEB 2020<\u002Ftext>\n          <text x=\"430\" y=\"234\">FEB 2023 · PEAK<\u002Ftext>\n          <text x=\"836\" y=\"234\">SEP 2026<\u002Ftext>\n        <\u002Fg>\n      <\u002Fsvg>\n      <figcaption style=\"font-size:12px; color:var(--color-neutral-700); margin-top:10px;\">Home loan rate ≈ repo + bank spread, typically 2.4–3.0% on EBLR.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:36px; margin-top:52px; align-items:start;\">\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px;\">Every MPC decision behind the line<\u002Fdiv>\n        <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Effective<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Repo<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Change<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ repoRows }}\" as=\"r\" hint-placeholder-count=\"13\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums;\">{{ r.date }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ r.rate }}%<\u002Fsc-raw-td>\n                <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums; color:var(--color-accent-700);\">{{ r.delta }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding-top:34px;\">\n        <div style=\"border-left:2px solid var(--color-accent-700); padding:2px 0 2px 20px;\">\n          <p style=\"font-size:19px; line-height:1.45; margin:0 0 16px; font-family:var(--font-heading); font-weight:400;\">\"Anytime is a good time to buy\" survives because everyone positioned to correct it profits from you believing it.<\u002Fp>\n          <p style=\"font-size:14px; line-height:1.6; color:var(--color-neutral-800); margin:0;\">The bank earns the same fee regardless of the rate cycle. The builder needs the sale. The agent is paid on the transaction.
