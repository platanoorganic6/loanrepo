Nobody in that chain is paid to tell you to wait — so almost nobody does. LoanRepo doesn't sell loans, doesn't refer lenders, and doesn't earn more when you buy, wait, or refinance.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top:26px; border-top:1px solid var(--color-divider); padding-top:20px;\">\n          <div style=\"font-family:var(--font-heading); font-size:28px; color:var(--color-accent-800); font-variant-numeric:tabular-nums;\">76%<\u002Fdiv>\n          <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:4px; max-width:46ch;\">of Indian home loan borrowers don't know the interest amount on their own loan — they track only the EMI. (Home Credit India financial literacy survey)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ SCREEN: EXAMPLES ══ -->\n  <sc-if value=\"{{ onExamples }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:clamp(28px,5vw,44px) clamp(16px,4vw,24px) 88px;\">\n    <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:12px;\">Real examples, not projections<\u002Fdiv>\n    <h1 style=\"font-size:clamp(28px,5.5vw,42px); line-height:1.06; margin:0 0 16px; max-width:24ch;\">Five purchase dates. Two very different outcomes.<\u002Fh1>\n    <p style=\"font-size:16px; line-height:1.6; max-width:70ch; color:var(--color-neutral-800); margin:0 0 34px;\">Every figure below is computed live by the same engine your own loan runs through — walked month by month against the actual repo history, not a single before-and-after estimate. The finding is uncomfortable in a useful way: the trap isn't universal, it's specific to <em>when<\u002Fem> you bought. Click any row to load it into the calculator.<\u002Fp>\n\n    <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n      <sc-raw-thead>\n        <sc-raw-tr><sc-raw-th>Disbursed<\u002Fsc-raw-th><sc-raw-th>Loan<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Rate then → now<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Tenure effect<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Lifetime cost<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\"><\u002Fsc-raw-th><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ examples }}\" as=\"ex\" hint-placeholder-count=\"5\">\n          <sc-raw-tr sc-camel-on-click=\"{{ ex.load }}\" style=\"cursor:pointer;\">\n            <sc-raw-td style=\"font-variant-numeric:tabular-nums; white-space:nowrap;\">{{ ex.date }}<\u002Fsc-raw-td>\n            <sc-raw-td><span style=\"font-size:15px;\">{{ ex.city }}<\u002Fspan><span style=\"display:block; font-size:12.5px; color:var(--color-neutral-700);\">{{ ex.note }}<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums; color:var(--color-neutral-700);\">{{ ex.rates }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums; font-family:var(--font-heading); font-size:17px;\">{{ ex.effect }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ ex.cost }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"text-align:right;\"><span class=\"tag tag-outline\">{{ ex.tag }}<\u002Fspan><\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table><\u002Fdiv>\n    <div style=\"font-size:12px; color:var(--color-neutral-700); margin-top:12px; max-width:74ch;\">All five modelled on EBLR with a 2.65% spread and the RBI-mandated quarterly reset. Lifetime cost is the difference between total payments on the actual rate path and total payments had the disbursal rate held.<\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ SCREEN: METHOD ══ -->\n  <sc-if value=\"{{ onMethod }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:clamp(28px,5vw,44px) clamp(16px,4vw,24px) 88px;\">\n    <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:12px;\">Method<\u002Fdiv>\n    <h1 style=\"font-size:clamp(28px,5.5vw,42px); line-height:1.06; margin:0 0 16px; max-width:24ch;\">Every assumption, stated.<\u002Fh1>\n    <p style=\"font-size:16px; line-height:1.6; max-width:70ch; color:var(--color-neutral-800); margin:0 0 40px;\">This tool is descriptive. It tells you what the rate cycle did to a loan with your particulars. It does not tell you to buy, wait, prepay or refinance, and it earns nothing from any of those.<\u002Fp>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:32px;\">\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--color-text);\">What we compute<\u002Fdiv>\n        <p style=\"font-size:14px; line-height:1.6; color:var(--color-neutral-800);\">We take your disbursal month, amount and tenure, set the opening rate from the repo rate in force that month plus a bank spread, and fix the EMI there. Then we advance the loan one month at a time. At each reset date we look up the repo rate actually in force and re-rate the loan, holding the EMI constant — which is what banks do by default. The term moves instead.<\u002Fp>\n        <p style=\"font-size:14px; line-height:1.6; color:var(--color-neutral-800);\">Past the current month, the model holds the repo rate at today's {{ nowRepo }}% rather than forecasting. Nobody can forecast it, including us.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--color-text);\">Assumptions you can check<\u002Fdiv>\n        <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n          <sc-raw-tbody>\n            <sc-raw-tr><sc-raw-td>EBLR / RLLR spread<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ eblrSpreadTxt }}%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>EBLR reset frequency<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">quarterly<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>MCLR spread (approx.)<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ mclrSpreadTxt }}%<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>MCLR reset frequency<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">annual<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Rate source<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">RBI MPC decisions<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr><sc-raw-td>Model date<\u002Fsc-raw-td><sc-raw-td style=\"text-align:right;\">8 Sep 2026<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table><\u002Fdiv>\n        <div style=\"font-size:12.5px; line-height:1.55; color:var(--color-neutral-700); margin-top:12px;\">These are defaults, used only when you don’t supply your own. Your real spread is printed in your sanction letter — enter it on the calculator and it replaces both, or log a check-in and we calibrate it from what your statement actually said. A spread 0.25% off moves a 20-year result by roughly a year, so this is the assumption worth removing.<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--color-text);\">What this doesn't do<\u002Fdiv>\n        <ul style=\"margin:0; padding:0; list-style:none; font-size:14px; line-height:1.6; color:var(--color-neutral-800);\">\n          <li style=\"padding:9px 0; border-bottom:1px solid var(--color-divider);\">Account for prepayments you already made, or missed payments.<\u002Fli>\n          <li style=\"padding:9px 0; border-bottom:1px solid var(--color-divider);\">Know your bank's individual MCLR, which is set internally rather than by the repo rate.<\u002Fli>\n          <li style=\"padding:9px 0; border-bottom:1px solid var(--color-divider);\">Include insurance, processing fees or tax deductions under 24(b) and 80C.<\u002Fli>\n          <li style=\"padding:9px 0; border-bottom:1px solid var(--color-divider);\">Recommend a lender. We have no lender relationships to recommend from.<\u002Fli>\n          <li style=\"padding:9px 0;\">Store anything unless you ask it to. The calculation runs in this page; a run leaves it only when you sign in and save.<\u002Fli>\n        <\u002Ful>\n        <div style=\"font-size:12.5px; line-height:1.55; color:var(--color-neutral-700); margin-top:14px;\">What we do keep: saved runs, readable only by the account that saved them; the rate history, which is public record; and anonymous counts of which screens get used, with no loan figures attached.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ dbEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"blueprint\" style=\"margin-top:48px; padding:28px; max-width:620px;\">\n      <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n      <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px;\">Enter-your-own-spread, and what's next<\u002Fdiv>\n      <p style=\"font-size:14px; line-height:1.6; color:var(--color-neutral-800); margin:0 0 16px;\">Leave an email and we'll write once when the spread field ships, and once more when the examples library opens for submissions. Nothing else.<\u002Fp>\n      <div style=\"display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;\">\n        <div class=\"field\" style=\"flex:1; min-width:220px;\"><label for=\"lr-wl\">Email<\u002Flabel><input class=\"input\" id=\"lr-wl\" type=\"email\" placeholder=\"you@example.com\" value=\"{{ fWaitlist }}\" sc-camel-on-change=\"{{ setWaitlist }}\"><\u002Fdiv>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ joinWaitlist }}\">Keep me posted<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:12.5px; color:var(--color-accent-800); margin-top:10px; min-height:18px;\">{{ waitlistMsg }}<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top:56px; border-top:1px solid var(--color-text); padding-top:32px; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:32px;\">\n      <div>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:12px;\">Why this exists<\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.65; color:var(--color-neutral-800);\">Before LoanRepo, I spent close to a decade advising retail investors as a financial advisor. The pattern that brought this platform into existence wasn't abstract — it was the same conversation, repeated for years: a client would call, confused, because their loan balance wasn't shrinking the way they expected.<\u002Fp>\n        <p style=\"font-size:15px; line-height:1.65; color:var(--color-neutral-800); margin-bottom:0;\">Nobody along the chain — the bank, the builder, the agent — had a reason to explain it clearly at the time it mattered. The information technically existed. It just wasn't ever assembled into something a borrower could use to decide. LoanRepo is that assembly.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"blueprint\" style=\"padding:26px; align-self:start;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:10px;\">Run your own numbers<\u002Fdiv>\n        <p style=\"font-size:14px; line-height:1.6; color:var(--color-neutral-800);\">Takes under a minute. No signup, no email, no result held back.<\u002Fp>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ goLoan }}\" style=\"letter-spacing:0.06em; text-transform:uppercase;\">Check your loan<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ SCREEN: SAVED RUNS ══ -->\n  <sc-if value=\"{{ onSaved }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:clamp(28px,5vw,44px) clamp(16px,4vw,24px) 88px;\">\n    <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:12px;\">Your account<\u002Fdiv>\n    <h1 style=\"font-size:clamp(28px,5.5vw,42px); line-height:1.06; margin:0 0 16px; max-width:24ch;\">Runs you've saved.<\u002Fh1>\n    <p style=\"font-size:16px; line-height:1.6; max-width:68ch; color:var(--color-neutral-800); margin:0 0 34px;\">Each row is a snapshot: the particulars you entered and the verdict at the time you saved it. Rates move, so a run saved last year will read differently if you run it again today. Only you can read these.<\u002Fp>\n\n    <sc-if value=\"{{ signedOut }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"blueprint\" style=\"padding:34px; max-width:520px;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading); font-size:19px; margin-bottom:8px;\">Sign in to see your saved runs<\u002Fdiv>\n        <p style=\"font-size:14px; color:var(--color-neutral-700); margin:0 0 18px;\">{{ savedEmptyNote }}<\u002Fp>\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ openAuth }}\">Sign in<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; align-items:baseline; border-top:1px solid var(--color-text); border-bottom:1px solid var(--color-divider); padding:16px 0; margin-bottom:32px;\">\n        <div>\n          <span style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase;\">Plan<\u002Fspan>\n          <span style=\"font-size:15px; margin-left:14px;\">{{ planLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isFree }}\" hint-placeholder-val=\"{{ true }}\">\n          <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ goUpgrade }}\">Track more than one loan — ₹149/mo<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th>Loan<\u002Fsc-raw-th><sc-raw-th>Disbursed<\u002Fsc-raw-th><sc-raw-th>Benchmark<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Verdict when saved<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\"><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ runs }}\" as=\"run\" hint-placeholder-count=\"2\">\n            <sc-raw-tr>\n              <sc-raw-td sc-camel-on-click=\"{{ run.select }}\" style=\"cursor:pointer;\"><span style=\"font-size:15px;\">{{ run.name }}<\u002Fspan><span style=\"display:block; font-size:12.5px; color:var(--color-neutral-700);\">{{ run.loan }}<\u002Fspan><\u002Fsc-raw-td>\n              <sc-raw-td style=\"font-variant-numeric:tabular-nums; white-space:nowrap;\">{{ run.started }}<\u002Fsc-raw-td>\n              <sc-raw-td><span class=\"tag tag-outline\">{{ run.benchmark }}<\u002Fspan><\u002Fsc-raw-td>\n              <sc-raw-td style=\"text-align:right; font-family:var(--font-heading); font-size:17px; font-variant-numeric:tabular-nums;\">{{ run.verdict }}<\u002Fsc-raw-td>\n              <sc-raw-td style=\"text-align:right; white-space:nowrap;\">\n                <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ run.load }}\" style=\"font-size:12px;\">Recalculate<\u002Fbutton>\n                <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ run.remove }}\" style=\"font-size:12px;\">Delete<\u002Fbutton>\n              <\u002Fsc-raw-td>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table><\u002Fdiv>\n      <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:14px;\">{{ runsNote }}<\u002Fdiv>\n\n      <sc-if value=\"{{ loanSelected }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:56px; border-top:1px solid var(--color-text); padding-top:30px;\">\n        <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:8px;\">Check-in log · {{ selectedName }}<\u002Fdiv>\n        <h2 style=\"font-size:30px; margin:0 0 10px; max-width:24ch;\">What your statement actually said.<\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.6; max-width:66ch; color:var(--color-neutral-800); margin:0 0 30px;\">Our figures are modelled from the repo rate and an assumed spread. Yours are the real ones. Logging what you see on your statement after a reset is how the two get reconciled — and it is the only record that survives a change to our assumptions.<\u002Fp>\n\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:36px; align-items:start;\">\n          <div class=\"blueprint\" style=\"padding:26px;\">\n            <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n            <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:16px;\">Log a check-in<\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n              <div class=\"field\"><label for=\"ci-rate\">Effective rate (%)<\u002Flabel><input class=\"input\" id=\"ci-rate\" type=\"number\" step=\"0.01\" placeholder=\"9.15\" value=\"{{ ciRate }}\" sc-camel-on-change=\"{{ setCiRate }}\"><\u002Fdiv>\n              <div class=\"field\"><label for=\"ci-emi\">EMI (₹)<\u002Flabel><input class=\"input\" id=\"ci-emi\" type=\"number\" step=\"100\" placeholder=\"37722\" value=\"{{ ciEmi }}\" sc-camel-on-change=\"{{ setCiEmi }}\"><\u002Fdiv>\n              <div class=\"field\"><label for=\"ci-out\">Outstanding (₹)<\u002Flabel><input class=\"input\" id=\"ci-out\" type=\"number\" step=\"1000\" placeholder=\"4730000\" value=\"{{ ciOut }}\" sc-camel-on-change=\"{{ setCiOut }}\"><\u002Fdiv>\n              <div class=\"field\"><label for=\"ci-rem\">Months remaining<\u002Flabel><input class=\"input\" id=\"ci-rem\" type=\"number\" step=\"1\" placeholder=\"243\" value=\"{{ ciRem }}\" sc-camel-on-change=\"{{ setCiRem }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px;\">\n              <label style=\"display:block; font-size:12px; margin-bottom:8px; color:var(--color-neutral-700);\">What changed since last time?<\u002Flabel>\n              <div style=\"display:grid; gap:8px;\">\n                <label class=\"radio\"><input type=\"radio\" name=\"ci-out-come\" value=\"tenure_extended\" checked=\"{{ ciOutcomeTenure }}\" sc-camel-on-change=\"{{ setCiOutcome }}\"><span class=\"dot\"><\u002Fspan>Tenure got longer, EMI didn't move<\u002Flabel>\n                <label class=\"radio\"><input type=\"radio\" name=\"ci-out-come\" value=\"emi_changed\" checked=\"{{ ciOutcomeEmi }}\" sc-camel-on-change=\"{{ setCiOutcome }}\"><span class=\"dot\"><\u002Fspan>EMI changed<\u002Flabel>\n                <label class=\"radio\"><input type=\"radio\" name=\"ci-out-come\" value=\"no_change\" checked=\"{{ ciOutcomeNone }}\" sc-camel-on-change=\"{{ setCiOutcome }}\"><span class=\"dot\"><\u002Fspan>Nothing visibly changed<\u002Flabel>\n                <label class=\"radio\"><input type=\"radio\" name=\"ci-out-come\" value=\"unsure\" checked=\"{{ ciOutcomeUnsure }}\" sc-camel-on-change=\"{{ setCiOutcome }}\"><span class=\"dot\"><\u002Fspan>Couldn't tell from the statement<\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\" style=\"margin-top:16px;\"><label for=\"ci-note\">Note (optional)<\u002Flabel><input class=\"input\" id=\"ci-note\" type=\"text\" placeholder=\"Called the branch, waiting on a written reply\" value=\"{{ ciNote }}\" sc-camel-on-change=\"{{ setCiNote }}\"><\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ logCheckIn }}\" style=\"margin-top:18px;\">Log it<\u002Fbutton>\n            <span style=\"font-size:12px; color:var(--color-accent-800); margin-left:12px;\">{{ ciMsg }}<\u002Fspan>\n            <div style=\"font-size:12.5px; line-height:1.55; color:var(--color-neutral-700); margin-top:14px; border-top:1px dashed var(--color-divider); padding-top:12px;\">Every field is optional except the outcome. \"Couldn't tell\" is a useful answer — it usually means the statement didn't say, which is the whole problem.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px;\">Logged so far<\u002Fdiv>\n            <div style=\"overflow-x:auto; -webkit-overflow-scrolling:touch;\"><sc-raw-table class=\"table\" style=\"min-width:520px;\">\n              <sc-raw-thead><sc-raw-tr><sc-raw-th>Observed<\u002Fsc-raw-th><sc-raw-th>Rate<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">EMI<\u002Fsc-raw-th><sc-raw-th style=\"text-align:right;\">Outcome<\u002Fsc-raw-th><sc-raw-th><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ checkIns }}\" as=\"ci\" hint-placeholder-count=\"2\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"font-variant-numeric:tabular-nums; white-space:nowrap;\">{{ ci.on }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"font-variant-numeric:tabular-nums;\">{{ ci.rate }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:right; font-variant-numeric:tabular-nums;\">{{ ci.emi }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:right; font-size:13px;\">{{ ci.outcome }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"text-align:right;\"><button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ ci.remove }}\" style=\"font-size:12px;\">×<\u002Fbutton><\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table><\u002Fdiv>\n            <div style=\"font-size:12.5px; color:var(--color-neutral-700); margin-top:10px;\">{{ checkInsNote }}<\u002Fdiv>\n\n            <sc-if value=\"{{ hasReconcile }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"blueprint\" style=\"margin-top:26px; padding:24px; background:var(--color-accent-100);\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:12px;\">Your statement against our model<\u002Fdiv>\n              <div style=\"display:grid; gap:12px;\">\n                <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline; border-top:1px dashed var(--color-divider); padding-top:12px;\">\n                  <span style=\"font-size:13px; color:var(--color-neutral-800);\">Your bank says<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-size:22px; font-variant-numeric:tabular-nums;\">{{ recTheirs }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline;\">\n                  <span style=\"font-size:13px; color:var(--color-neutral-800);\">We modelled<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-size:22px; font-variant-numeric:tabular-nums;\">{{ recOurs }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline;\">\n                  <span style=\"font-size:13px; color:var(--color-neutral-800);\">Your real spread, therefore<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-size:22px; font-variant-numeric:tabular-nums; color:var(--color-accent-800);\">{{ recSpread }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px; line-height:1.55; color:var(--color-neutral-800); margin-top:14px;\">{{ recNote }}<\u002Fdiv>\n              <sc-if value=\"{{ canApplySpread }}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ applySpread }}\" style=\"margin-top:14px; font-size:12px;\">Use this spread in the calculator<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div class=\"blueprint\" style=\"margin-top:30px; padding:24px;\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:6px;\">Your loan year in review<\u002Fdiv>\n              <p style=\"font-size:13px; color:var(--color-neutral-700); margin:0 0 18px;\">{{ yirWindow }}<\u002Fp>\n              <div style=\"display:grid; gap:14px;\">\n                <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline; border-top:1px dashed var(--color-divider); padding-top:14px;\">\n                  <span style=\"font-size:13px; color:var(--color-neutral-700);\">Rate moved<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-size:22px; font-variant-numeric:tabular-nums;\">{{ yirRate }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline;\">\n                  <span style=\"font-size:13px; color:var(--color-neutral-700);\">Paid in EMIs<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-size:22px; font-variant-numeric:tabular-nums;\">{{ yirPaid }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline;\">\n                  <span style=\"font-size:13px; color:var(--color-neutral-700);\">Of which interest<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-size:22px; font-variant-numeric:tabular-nums;\">{{ yirInterest }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline;\">\n                  <span style=\"font-size:13px; color:var(--color-neutral-700);\">Balance came down by<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-size:22px; font-variant-numeric:tabular-nums;\">{{ yirPrincipal }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; gap:16px; align-items:baseline;\">\n                  <span style=\"font-size:13px; color:var(--color-neutral-700);\">Schedule position<\u002Fspan>\n                  <span style=\"font-family:var(--font-heading); font-size:22px; font-variant-numeric:tabular-nums;\">{{ yirPosition }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px; line-height:1.55; color:var(--color-neutral-700); margin-top:16px; border-top:1px solid var(--color-divider); padding-top:12px;\">{{ yirNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ══ SCREEN: UPGRADE ══ -->\n  <sc-if value=\"{{ onUpgrade }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:1120px; margin:0 auto; padding:clamp(28px,5vw,44px) clamp(16px,4vw,24px) 88px;\">\n    <div style=\"font-family:var(--font-heading); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--color-accent-700); margin-bottom:12px;\">Plans<\u002Fdiv>\n    <h1 style=\"font-size:clamp(28px,5.5vw,42px); line-height:1.06; margin:0 0 16px; max-width:26ch;\">One loan is free, and stays free.<\u002Fh1>\n    <p style=\"font-size:16px; line-height:1.6; max-width:68ch; color:var(--color-neutral-800); margin:0 0 40px;\">The calculator, the rate history, the examples and the bank message are free for everyone, with no account. Paying gets you more than one tracked loan — which in practice means a parent's, a spouse's, or a second property's — and nothing is held back from the free tier to make the paid one look better.<\u002Fp>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:32px; align-items:stretch;\">\n      <div class=\"blueprint\" style=\"padding:30px; display:flex; flex-direction:column;\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px;\">Free<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading); font-size:52px; line-height:0.9; font-variant-numeric:tabular-nums;\">₹0<\u002Fdiv>\n        <div style=\"font-size:13px; color:var(--color-neutral-700); margin-top:8px;\">forever, no card<\u002Fdiv>\n        <ul style=\"margin:24px 0 0; padding:0; list-style:none; font-size:14px; line-height:1.6;\">\n          <li style=\"padding:9px 0; border-top:1px solid var(--color-divider);\">The full engine, every calculation on this site<\u002Fli>\n          <li style=\"padding:9px 0; border-top:1px solid var(--color-divider);\">Rate history, examples library, method<\u002Fli>\n          <li style=\"padding:9px 0; border-top:1px solid var(--color-divider);\">The bank message, with your figures<\u002Fli>\n          <li style=\"padding:9px 0; border-top:1px solid var(--color-divider);\">One tracked loan, with unlimited check-ins<\u002Fli>\n          <li style=\"padding:9px 0; border-top:1px solid var(--color-divider);\">Year in review on that loan<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div style=\"background:var(--color-accent-900); color:var(--color-bg); padding:30px; display:flex; flex-direction:column;\">\n        <div style=\"font-family:var(--font-heading); font-size:13px; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:14px; opacity:0.75;\">Unlimited<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading); font-size:52px; line-height:0.9; font-variant-numeric:tabular-nums;\">₹149<\u002Fdiv>\n        <div style=\"font-size:13px; opacity:0.75; margin-top:8px;\">per month, cancel any time<\u002Fdiv>\n        <ul style=\"margin:24px 0 0; padding:0; list-style:none; font-size:14px; line-height:1.6;\">\n          <li style=\"padding:9px 0; border-top:1px solid rgba(242,242,243,0.25);\">Everything in free<\u002Fli>\n          <li style=\"padding:9px 0; border-top:1px solid rgba(242,242,243,0.25);\">As many tracked loans as you have<\u002Fli>\n          <li style=\"padding:9px 0; border-top:1px solid rgba(242,242,243,0.25);\">A reset-date email per loan, when it lands<\u002Fli>\n          <li style=\"padding:9px 0; border-top:1px solid rgba(242,242,243,0.25);\">Post-decision digest after each MPC meeting<\u002Fli>\n        <\u002Ful>\n        <div style=\"margin-top:auto; padding-top:26px;\">\n          <button type=\"button\" class=\"btn\" sc-camel-on-click=\"{{ upgrade }}\" style=\"background:var(--color-bg); color:var(--color-accent-900); border-color:var(--color-bg); letter-spacing:0.06em; text-transform:uppercase; padding:13px 22px;\">{{ upgradeCta }}<\u002Fbutton>\n          <div style=\"font-size:12.5px; margin-top:12px; min-height:18px; opacity:0.85;\">{{ upgradeMsg }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:40px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:28px; border-top:1px solid var(--color-divider); padding-top:26px; font-size:13px; line-height:1.6; color:var(--color-neutral-700);\">\n      <div><b style=\"color:var(--color-text);\">Why a subscription and not a fee.<\u002Fb> A one-time fee would reward us for the first calculation. The whole point is the ones you do years later, after a reset you'd otherwise have missed.<\u002Fdiv>\n      <div><b style=\"color:var(--color-text);\">What we still don't do.<\u002Fb> We don't sell loans, refer lenders, or take a commission. Paying us does not change a single number the engine produces.<\u002Fdiv>\n      <div><b style=\"color:var(--color-text);\">Cancelling.<\u002Fb> Cancel and you drop to free with your first loan intact. Nothing is deleted, and your check-in history stays readable.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer style=\"border-top:1px solid var(--color-divider);\">\n    <div style=\"max-width:1120px; margin:0 auto; padding:26px 24px 40px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--color-neutral-700);\">\n      <span>LoanRepo — real rate history, no lender affiliation.<\u002Fspan>\n      <span>All figures computed from RBI MPC repo rate records, 2020–2026.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;eblrSpread&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:2.65,&quot;min&quot;:1.5,&quot;max&quot;:4,&quot;step&quot;:0.05,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model assumptions&quot;},&quot;mclrSpread&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3.75,&quot;min&quot;:2.5,&quot;max&quot;:5,&quot;step&quot;:0.05,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Model assumptions&quot;},&quot;showScenario&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Result screen&quot;},&quot;showChecklist&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Result screen&quot;}}\">\nclass Component extends DCLogic {\n  static REPO = [\n    { d: \"2020-02-06\", r: 5.15 }, { d: \"2020-03-27\", r: 4.40 }, { d: \"2020-05-22\", r: 4.00 },\n    { d: \"2022-05-04\", r: 4.40 }, { d: \"2022-06-08\", r: 4.90 }, { d: \"2022-08-05\", r: 5.40 },\n    { d: \"2022-09-30\", r: 5.90 }, { d: \"2022-12-07\", r: 6.25 }, { d: \"2023-02-08\", r: 6.50 },\n    { d: \"2025-02-07\", r: 6.25 }, { d: \"2025-04-09\", r: 6.00 }, { d: \"2025-06-06\", r: 5.50 },\n    { d: \"2025-12-05\", r: 5.25 }\n  ];\n  static TODAY = new Date(2026, 8, 8);\n  static CASES = [\n    { date: \"2020-08\", city: \"Bengaluru\", amt: 4000000, ten: 20, note: \"Bought at the deep-COVID rate floor\" },\n    { date: \"2021-06\", city: \"Pune\", amt: 5000000, ten: 20, note: \"Bought during the COVID housing rush\" },\n    { date: \"2022-01\", city: \"Hyderabad\", amt: 6500000, ten: 20, note: \"Bought just before the hike cycle began\" },\n    { date: \"2023-03\", city: \"Mumbai\", amt: 7500000, ten: 20, note: \"Bought right after the peak hike\" },\n    { date: \"2024-06\", city: \"Chennai\", amt: 5500000, ten: 15, note: \"Bought during the two-year rate hold\" }\n  ];\n  static QUESTIONS = [\n    { n: \"01\", ask: \"What is my current effective rate, and what spread over the repo rate am I on?\", why: \"The spread is contractual and fixed at sanction. If a new borrower at your bank gets a lower one today, that is the number to argue about.\" },\n    { n: \"02\", ask: \"What is my remaining tenure in months, as it stands on your system right now?\", why: \"Compare it with what your sanction letter said. The difference is the answer to everything above.\" },\n    { n: \"03\", ask: \"Has my EMI or my tenure absorbed the rate changes since disbursal?\", why: \"Banks default to extending tenure because it needs no consent. You are allowed to ask for the other option.\" },\n    { n: \"04\", ask: \"What would it cost to reset my spread to your current card rate?\", why: \"Most banks run a conversion fee, often a few thousand rupees, and are not obliged to offer it unprompted.\" },\n    { n: \"05\", ask: \"If I am on MCLR, what does switching to EBLR cost, and what is the rate after switching?\", why: \"EBLR passes repo cuts through faster. The switch is a borrower right, not a favour.\" }\n  ];\n\n  state = {\n    screen: \"loan\", date: \"2021-06\", amount: 5000000, tenure: 20,\n    benchmark: \"EBLR\", prepay: 500000, prepayMode: \"tenure\", result: null,\n    ownSpread: \"\", useOwnSpread: false, buyAmount: 5000000, buyTenure: 20,\n    payoffLump: 500000, payoffExtra: 5000,\n    user: null, authOpen: false, email: \"\", authMsg: \"\", saveMsg: \"\",\n    runs: [], repoHistory: null, cases: null, waitlist: \"\", waitlistMsg: \"\",\n    sub: null, selectedLoanId: null, checkIns: [], upgradeMsg: \"\", ciMsg: \"\",\n    ciRate: \"\", ciEmi: \"\", ciOut: \"\", ciRem: \"\", ciNote: \"\", ciOutcome: \"tenure_extended\"\n  };\n\n  get db() { return window.LoanRepoDB || { enabled: false }; }\n\n  componentDidMount() {\n    this.compute();\n    this.initDb(0);\n  }\n\n  // The data layer is a separate script; in a bundled build it can finish\n  // executing after this component mounts, so wait for it rather than\n  // deciding once and hiding the account features for the whole session.\n  initDb(attempt) {\n    const db = this.db;\n    if (!db.enabled) {\n      if (attempt < 40) this.dbTimer = setTimeout(() => this.initDb(attempt + 1), 100);\n      return;\n    }\n    this.forceUpdate();\n    this.unsub = db.onAuth(user => {\n      this.setState({ user }, () => { if (user) this.loadRuns(); });\n    });\n    db.fetchRepoHistory().then(h => { if (h) this.setState({ repoHistory: h }, () => this.compute()); });\n    db.fetchExamples().then(c => { if (c) this.setState({ cases: c }); });\n    db.track(\"app_view\", {});\n  }\n  componentWillUnmount() {\n    if (this.unsub) this.unsub();\n    if (this.dbTimer) clearTimeout(this.dbTimer);\n  }\n\n  loadRuns() {\n    this.db.listRuns().then(runs => {\n      this.setState({ runs, selectedLoanId: this.state.selectedLoanId || (runs[0] && runs[0].id) || null },\n        () => { if (this.state.selectedLoanId) this.loadCheckIns(); });\n    });\n    this.db.fetchSubscription().then(sub => this.setState({ sub }));\n  }\n  loadCheckIns() {\n    this.db.listCheckIns(this.state.selectedLoanId).then(checkIns => this.setState({ checkIns }));\n  }\n\n  // A logged effective rate minus the repo rate in force that day IS the\n  // borrower's real spread. One check-in removes our largest assumption.\n  get calibrated() {\n    const ci = (this.state.checkIns || []).filter(c => c.effective_rate);\n    if (!ci.length) return null;\n    const latest = ci[0];\n    const repo = this.repoOn(new Date(latest.observed_on));\n    const sp = Number(latest.effective_rate) - repo;\n    return sp > 0.5 && sp < 8 ? sp : null;\n  }\n\n  get isPro() {\n    const sub = this.state.sub;\n    return !!(sub && sub.plan === \"pro\" && sub.status === \"active\");\n  }\n\n  startUpgrade() {\n    if (!this.state.user) { this.setState({ authOpen: true }); return; }\n    if (this.isPro) return;\n    this.setState({ upgradeMsg: \"Opening checkout…\" });\n    this.db.startCheckout().then(res => {\n      if (!res.ok || !res.subscriptionId || !window.Razorpay) {\n        this.setState({ upgradeMsg: this.friendly(res, \"Checkout isn't available right now. Try again shortly.\") });\n        return;\n      }\n      const rz = new window.Razorpay({\n        key: res.keyId,\n        subscription_id: res.subscriptionId,\n        name: \"LoanRepo\",\n        description: \"Unlimited tracked loans\",\n        prefill: { email: this.state.user.email },\n        theme: { color: \"#5980a6\" },\n        handler: () => {\n          // The webhook is what actually grants the plan; poll for it.\n          this.setState({ upgradeMsg: \"Payment received. Activating…\" });\n          let tries = 0;\n          const poll = () => {\n            this.db.fetchSubscription().then(sub => {\n              this.setState({ sub });\n              if (sub && sub.plan === \"pro\" && sub.status === \"active\") {\n                this.setState({ upgradeMsg: \"You're on Unlimited. Track as many loans as you like.\" });\n              } else if (tries++ < 10) { setTimeout(poll, 2000); }\n              else { this.setState({ upgradeMsg: \"Payment went through; the plan is taking a moment to activate. Refresh shortly.\" }); }\n            });\n          };\n          poll();\n        },\n        modal: { ondismiss: () => this.setState({ upgradeMsg: \"Checkout closed. Nothing was charged.\" }) }\n      });\n      this.setState({ upgradeMsg: \"\" });\n      rz.open();\n      this.db.track(\"checkout_opened\", {});\n    });\n  }\n\n  // Effective rate in force during month m of a simulated loan.\n  rateAtMonth(r, m) {\n    const k = Math.floor(m / r.resetN) * r.resetN;\n    const d = k === 0 ? r.start : this.addMonths(r.start, k);\n    return this.repoOn(d <= Component.TODAY ? d : Component.TODAY) + r.spread;\n  }\n\n  // Never surface a database message to a borrower. Log it, show a sentence.\n  friendly(res, fallback) {\n    const raw = (res && (res.error || res.reason)) || \"\";\n    if (raw) console.warn(\"[LoanRepo] \" + raw);\n    if (res && res.reason === \"loan-limit\") return \"The free tier tracks one loan. Upgrade to add another.\";\n    if (res && res.reason === \"signed-out\") return \"Sign in first, then save.\";\n    if (res && res.reason === \"not-configured\") return \"This isn't switched on yet — sorry.\";\n    if (/schema cache|does not exist|relation/i.test(raw)) return \"This isn't switched on yet — sorry. Nothing you entered was lost.\";\n    if (/row-level security|permission|policy/i.test(raw)) return \"That didn't go through. Try signing out and back in.\";\n    if (/rate limit|too many/i.test(raw)) return \"Too many attempts just now. Try again in a minute.\";\n    if (/fetch|network|timeout/i.test(raw)) return \"Couldn't reach our server. Check your connection and try again.\";\n    return fallback;\n  }\n\n  go(screen) {\n    this.setState({ screen, saveMsg: \"\" });\n    this.db.track(\"screen_view\", { screen });\n    if (screen === \"saved\" && this.state.user) this.loadRuns();\n  }\n\n  get spreads() {\n    return {\n      EBLR: Number(this.props.eblrSpread ?? 2.65),\n      MCLR: Number(this.props.mclrSpread ?? 3.75)\n    };\n  }\n\n  // The spread is the single largest source of error in the model, so a\n  // user-supplied one always wins over our default.\n  spreadFor(benchmark) {\n    const own = Number(this.state.ownSpread);\n    if (this.state.useOwnSpread && own > 0 && own < 10) return own;\n    return this.spreads[benchmark];\n  }\n\n  get repo() { return this.state.repoHistory || Component.REPO; }\n  get cases() { return this.state.cases || Component.CASES; }\n\n  repoOn(date) {\n    const h = this.repo;\n    let r = h[0].r;\n    for (const e of h) { if (new Date(e.d) <= date) r = e.r; else break; }\n    return r;\n  }\n  emi(P, pct, n) {\n    const r = pct / 1200;\n    return r === 0 ? P / n : (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);\n  }\n  monthsBetween(a, b) { return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()); }\n  addMonths(d, n) { return new Date(d.getFullYear(), d.getMonth() + n, d.getDate()); }\n  mLabel(d) { return d.toLocaleDateString(\"en-IN\", { month: \"short\", year: \"numeric\" }); }\n  inr(n) {\n    const v = Math.round(n);\n    return \"₹\" + v.toLocaleString(\"en-IN\");\n  }\n  short(n) {\n    const a = Math.abs(n);\n    if (a >= 1e7) return \"₹\" + (n / 1e7).toFixed(2) + \" Cr\";\n    if (a >= 1e5) return \"₹\" + (n / 1e5).toFixed(1) + \"L\";\n    return this.inr(n);\n  }\n\n  simulate(dateStr, principal, tenureYears, benchmark, spreadOverride) {\n    const [y, m] = dateStr.split(\"-\").map(Number);\n    const start = new Date(y, m - 1, 15);\n    const spread = spreadOverride != null ? spreadOverride : this.spreadFor(benchmark);\n    const resetN = benchmark === \"MCLR\" ? 12 : 3;\n    const n = Math.round(tenureYears * 12);\n    const startRate = this.repoOn(start) + spread;\n    const e0 = this.emi(principal, startRate, n);\n    const todayM = Math.max(this.monthsBetween(start, Component.TODAY), 1);\n    const cap = Math.max(n * 2, 480);\n\n    let bal = principal, rate = startRate, payoffM = null;\n    const series = [{ m: 0, bal: principal }];\n    const resets = [];\n    let nowBal = principal, nowRate = startRate;\n\n    for (let i = 1; i <= cap; i++) {\n      if (i % resetN === 0) {\n        const d = this.addMonths(start, i);\n        const nr = (d <= Component.TODAY ? this.repoOn(d) : this.repoOn(Component.TODAY)) + spread;\n        if (Math.abs(nr - rate) > 0.001) {\n          if (d <= Component.TODAY) {\n            resets.push({\n              date: this.mLabel(d), month: \"month \" + i,\n              from: rate.toFixed(2), to: nr.toFixed(2),\n              delta: (nr > rate ? \"+\" : \"−\") + Math.round(Math.abs(nr - rate) * 100) + \" bps\",\n              bal: this.short(bal), interest: this.inr((bal * nr) / 1200)\n            });\n          }\n          rate = nr;\n        }\n      }\n      const r = rate / 1200;\n      bal = bal * (1 + r) - e0;\n      if (bal <= 0) { bal = 0; payoffM = i; series.push({ m: i, bal: 0 }); break; }\n      series.push({ m: i, bal });\n      if (i === todayM) { nowBal = bal; nowRate = rate; }\n      if (i > todayM && bal > principal * 1.5) { break; }\n    }\n    if (todayM > series.length - 1) { nowBal = bal; nowRate = rate; }\n\n    const promised = [];\n    let pb = principal;\n    for (let i = 0; i <= n; i++) {\n      promised.push({ m: i, bal: Math.max(pb, 0) });\n      pb = pb * (1 + startRate / 1200) - e0;\n    }\n    const promisedNow = promised[Math.min(todayM, n)].bal;\n\n    return { start, startRate, spread, resetN, n, e0, todayM, nowBal, nowRate, payoffM, series, promised, promisedNow, resets, benchmark, principal, tenureYears };\n  }\n\n  overpayPct(principal, startRate, tenureYears, extraCash) {\n    const n = Math.round(tenureYears * 12);\n    const base = this.emi(principal, startRate, n);\n    let lo = 0, hi = 300, mid = 0;\n    for (let i = 0; i < 60; i++) {\n      mid = (lo + hi) / 2;\n      const cost = (this.emi(principal * (1 + mid / 100), startRate, n) - base) * n;\n      if (cost < extraCash) lo = mid; else hi = mid;\n    }\n    return mid;\n  }\n  remMonths(bal, pct, e) {\n    const r = pct / 1200;\n    if (bal <= 0) return 0;\n    if (e <= bal * r) return Infinity;\n    return Math.log(e / (e - bal * r)) / Math.log(1 + r);\n  }\n\n  compute(after) {\n    const s = this.state;\n    this.setState(\n      { result: this.simulate(s.date, Number(s.amount), Number(s.tenure), s.benchmark) },\n      () => { if (after) setTimeout(after, 60); }\n    );\n  }\n\n  points(series, principal, maxM) {\n    const x0 = 0, x1 = 858, yTop = 16, yBot = 196;\n    return series.map(p => {\n      const x = x0 + (p.m / maxM) * (x1 - x0);\n      const y = yBot - (Math.min(p.bal / principal, 1)) * (yBot - yTop);\n      return x.toFixed(1) + \",\" + y.toFixed(1);\n    }).join(\" \");\n  }\n\n  repoLinePoints() {\n    const x0 = 62, x1 = 906, yTop = 18, yBot = 214, lo = 4.0, hi = 6.5;\n    const start = new Date(2020, 1, 6), end = Component.TODAY;\n    const total = this.monthsBetween(start, end);\n    const pts = [];\n    for (let i = 0; i <= total; i++) {\n      const d = this.addMonths(start, i);\n      const r = this.repoOn(d);\n      const x = x0 + (i / total) * (x1 - x0);\n      const y = yBot - ((r - lo) / (hi - lo)) * (yBot - yTop);\n      pts.push(x.toFixed(1) + \",\" + y.toFixed(1));\n    }\n    return pts.join(\" \");\n  }\n\n  renderVals() {\n    const s = this.state;\n    const nav = k => (s.screen === k ? \"var(--color-text)\" : \"transparent\");\n    const nowRepo = this.repoOn(Component.TODAY);\n    const sp = this.spreads;\n\n    const v = {\n      onLoan: s.screen === \"loan\", onCycle: s.screen === \"cycle\",\n      onExamples: s.screen === \"examples\", onMethod: s.screen === \"method\",\n      onSaved: s.screen === \"saved\", onUpgrade: s.screen === \"up  s.benchmark,\n          result: { verdict: v.isLeak ? \"+\" + v.leakYears + \" yrs\" : \"−\" + v.aheadYears + \" yrs\", startRate: v.startRate, nowRate: v.nowRate, balance: Math.round(r.nowBal), emi: Math.round(r.e0) }\n        }).then(res => {\n          this.setState({ saveMsg: res.ok ? \"Tracked. Find it under Saved runs.\" : this.friendly(res, \"Couldn't save that run. Try again.\") });\n          if (res.ok) { this.loadRuns(); this.db.track(\"run_saved\", { benchmark: s.benchmark }); }\n          if (!res.ok && res.reason === \"loan-limit\") this.go(\"upgrade\");\n        });\n      },\n      runs: (s.runs || []).map(row => ({\n        name: row.name || row.label || \"Untitled loan\",\n        loan: this.short(Number(row.amount)) + \" · \" + row.tenure_years + \"yr\",\n        started: row.start_month, benchmark: row.benchmark,\n        verdict: (row.result && row.result.verdict) || \"—\",\n        select: () => this.setState({ selectedLoanId: row.id, ciMsg: \"\" }, () => this.loadCheckIns()),\n        load: () => this.setState({ date: row.start_month, amount: Number(row.amount), tenure: row.tenure_years, benchmark: row.benchmark, screen: \"loan\" }, () => this.compute()),\n        remove: () => this.db.deleteRun(row.id).then(() => this.setState({ selectedLoanId: null, checkIns: [] }, () => this.loadRuns()))\n      })),\n      runsNote: (s.runs || []).length\n        ? \"Pick a loan to log a check-in against it. Recalculate re-runs it against today's rate history.\"\n        : \"No tracked loans yet. Run a loan, then use “Track this loan”.\",\n      savedEmptyNote: \"Magic link or Google, whichever you prefer. We store the loan particulars and what you log against them — nothing about the property, nothing about your identity beyond the email.\",\n      planLabel: this.isPro ? \"Unlimited — ₹149/mo\" : \"Free — one tracked loan\",\n      isFree: !this.isPro,\n      upgradeMsg: s.upgradeMsg,\n      upgradeCta: this.isPro ? \"You're on Unlimited\" : \"Upgrade — ₹149/mo\",\n      upgrade: () => this.startUpgrade(),\n      fWaitlist: s.waitlist, waitlistMsg: s.waitlistMsg,\n      setWaitlist: e => this.setState({ waitlist: e.target.value }),\n      joinWaitlist: () => {\n        const em = (s.waitlist || \"\").trim();\n        if (!em || em.indexOf(\"@\") < 1) { this.setState({ waitlistMsg: \"Enter a valid email address.\" }); return; }\n        this.db.joinWaitlist(em, \"method-screen\").then(res => this.setState({\n          waitlistMsg: res.ok ? (res.duplicate ? \"You're already on the list.\" : \"Done. Two emails, maximum.\")\n            : this.friendly(res, \"Couldn't add you just now. Try again in a moment.\")\n        }));\n      },\n      print: () => window.print(),\n      fDate: s.date, fAmount: s.amount, fTenure: s.tenure, fPrepay: s.prepay,\n      isEblr: s.benchmark === \"EBLR\", isMclr: s.benchmark === \"MCLR\",\n      isModeTenure: s.prepayMode === \"tenure\", isModeEmi: s.prepayMode === \"emi\",\n      setDate: e => this.setState({ date: e.target.value }),\n      setAmount: e => this.setState({ amount: e.target.value }),\n      setTenure: e => this.setState({ tenure: e.target.value }),\n      setBenchmark: e => this.setState({ benchmark: e.target.value }),\n      useOwnSpread: s.useOwnSpread, ownSpread: s.ownSpread,\n      setUseOwnSpread: e => this.setState({ useOwnSpread: e.target.checked }, () => this.compute()),\n      setOwnSpread: e => this.setState({ ownSpread: e.target.value }, () => this.compute()),\n      spreadHint: this.calibrated\n        ? \"Calibrated from your last check-in: your statement implied about \" + this.calibrated.toFixed(2) + \"%.\"\n        : \"Typical EBLR spreads run 2.4–3.0%. Log a check-in later and we can calibrate this from your own statement.\",\n      setPrepay: e => this.setState({ prepay: e.target.value }),\n      setPrepayMode: e => this.setState({ prepayMode: e.target.value }),\n      resultRef: el => { this.resultEl = el; },\n      // The result sits below the fold, so a click with no movement reads as a\n      // dead button. Bring it to the top of the viewport instead.\n      run: () => this.compute(() => {\n        const el = this.resultEl;\n        if (!el || !window.scrollTo) return;\n        const y = el.getBoundingClientRect().top + window.pageYOffset - 16;\n        window.scrollTo({ top: y, behavior: \"smooth\" });\n      }),\n      showScenario: this.props.showScenario !== false,\n      showChecklist: this.props.showChecklist !== false,\n      questions: Component.QUESTIONS,\n      nowRepo: nowRepo.toFixed(2),\n      eblrSpreadTxt: sp.EBLR.toFixed(2), mclrSpreadTxt: sp.MCLR.toFixed(2),\n      cyclePctTxt: Math.round(((nowRepo - 4.0) / 2.5) * 100) + \"%\",\n      repoLine: this.repoLinePoints(),\n      repoNowY: (214 - ((nowRepo - 4.0) / 2.5) * 196).toFixed(1),\n      repoRows: this.repo.map((e, i) => {\n        const prev = i === 0 ? null : this.repo[i - 1].r;\n        return {\n          date: new Date(e.d).toLocaleDateString(\"en-IN\", { day: \"2-digit\", month: \"short\", year: \"numeric\" }),\n          rate: e.r.toFixed(2),\n          delta: prev === null ? \"—\" : (e.r > prev ? \"+\" : \"−\") + Math.round(Math.abs(e.r - prev) * 100) + \" bps\"\n        };\n      }),\n      examples: this.cases.map(c => {\n        const r = this.simulate(c.date, c.amt, c.ten, \"EBLR\");\n        const extraM = r.payoffM === null ? null : r.payoffM - r.n;\n        const leak = extraM !== null && extraM > 1;\n        return {\n          date: this.mLabel(r.start), city: c.city + \" · \" + this.short(c.amt) + \" · \" + c.ten + \"yr\", note: c.note,\n          rates: r.startRate.toFixed(2) + \"% → \" + r.nowRate.toFixed(2) + \"%\",\n          effect: extraM === null ? \"not clearing\" : (leak ? \"+\" : \"−\") + Math.abs(extraM / 12).toFixed(1) + \" yrs\",\n          cost: extraM === null ? \"—\" : (leak ? this.short(extraM * r.e0) : \"−\" + this.short(Math.abs(extraM) * r.e0)),\n          tag: extraM === null ? \"Underwater\" : leak ? \"Leakage\" : \"Advantage\",\n          load: () => this.setState({ date: c.date, amount: c.amt, tenure: c.ten, benchmark: \"EBLR\", screen: \"loan\" }, () => this.compute())\n        };\n      })\n    };\n\n    // ── buying soon: the same loan under rate paths the repo has actually taken ──\n    {\n      const P = Math.max(Number(s.buyAmount) || 0, 1);\n      const yrs = Math.max(Number(s.buyTenure) || 1, 1);\n      const n = Math.round(yrs * 12);\n      const bsp = this.spreadFor(\"EBLR\");\n      const r0 = nowRepo + bsp;\n      const e0 = this.emi(P, r0, n);\n      const path = (name, note, settleRepo) => {\n        const settled = settleRepo + bsp;\n        const m = this.remMonths(P, settled, e0);\n        return {\n          name, note, rate: settled.toFixed(2), emi: this.inr(e0),\n          years: m === Infinity ? \"never clears\" : (m / 12).toFixed(1) + \" yrs\",\n          total: m === Infinity ? \"—\" : this.short(m * e0)\n        };\n      };\n      Object.assign(v, {\n        buyAmount: s.buyAmount, buyTenure: s.buyTenure,\n        setBuyAmount: e => this.setState({ buyAmount: e.target.value }),\n        setBuyTenure: e => this.setState({ buyTenure: e.target.value }),\n        buyRate: r0.toFixed(2), buySpreadTxt: bsp.toFixed(2),\n        buyScenarios: [\n          path(\"holds where it is\", \"No change from today's \" + nowRepo.toFixed(2) + \"%\", nowRepo),\n          path(\"falls to the 2020 floor\", \"As it did in May 2020, and held two years\", 4.0),\n          path(\"returns to the 2023 peak\", \"As it did in Feb 2023, and held two years\", 6.5),\n          path(\"rises 250 bps\", \"The fastest real move on record — nine months in 2022\", Math.min(nowRepo + 2.5, 9))\n        ],\n        eblrToday: r0.toFixed(2),\n        mclrToday: (nowRepo + this.spreads.MCLR).toFixed(2),\n        eblrEmi: this.inr(e0),\n        mclrEmi: this.inr(this.emi(P, nowRepo + this.spreads.MCLR, n))\n      });\n    }\n\n    // ── tracking: check-in log + year in review for the selected loan ──\n    const sel = (s.runs || []).filter(x => x.id === s.selectedLoanId)[0] || null;\n    const OUTCOME = {\n      tenure_extended: \"Tenure longer\", emi_changed: \"EMI changed\",\n      no_change: \"No change\", unsure: \"Couldn't tell\"\n    };\n    Object.assign(v, {\n      loanSelected: !!sel,\n      selectedName: sel ? (sel.name || sel.label || \"Untitled loan\") : \"\",\n      ciRate: s.ciRate, ciEmi: s.ciEmi, ciOut: s.ciOut, ciRem: s.ciRem, ciNote: s.ciNote, ciMsg: s.ciMsg,\n      ciOutcomeTenure: s.ciOutcome === \"tenure_extended\",\n      ciOutcomeEmi: s.ciOutcome === \"emi_changed\",\n      ciOutcomeNone: s.ciOutcome === \"no_change\",\n      ciOutcomeUnsure: s.ciOutcome === \"unsure\",\n      setCiRate: e => this.setState({ ciRate: e.target.value }),\n      setCiEmi: e => this.setState({ ciEmi: e.target.value }),\n      setCiOut: e => this.setState({ ciOut: e.target.value }),\n      setCiRem: e => this.setState({ ciRem: e.target.value }),\n      setCiNote: e => this.setState({ ciNote: e.target.value }),\n      setCiOutcome: e => this.setState({ ciOutcome: e.target.value }),\n      logCheckIn: () => {\n        if (!sel) return;\n        this.db.logCheckIn(sel.id, {\n          effective_rate: s.ciRate ? Number(s.ciRate) : null,\n          emi: s.ciEmi ? Number(s.ciEmi) : null,\n          outstanding: s.ciOut ? Number(s.ciOut) : null,\n          remaining_months: s.ciRem ? Number(s.ciRem) : null,\n          outcome: s.ciOutcome, note: s.ciNote || null\n        }).then(res => {\n          this.setState({\n            ciMsg: res.ok ? \"Logged.\" : this.friendly(res, \"Couldn't log that. Try again.\"),\n            ciRate: res.ok ? \"\" : s.ciRate, ciEmi: res.ok ? \"\" : s.ciEmi,\n            ciOut: res.ok ? \"\" : s.ciOut, ciRem: res.ok ? \"\" : s.ciRem, ciNote: res.ok ? \"\" : s.ciNote\n          });\n          if (res.ok) { this.loadCheckIns(); this.db.track(\"check_in_logged\", { outcome: s.ciOutcome }); }\n        });\n      },\n      checkIns: (s.checkIns || []).map(row => ({\n        on: new Date(row.observed_on).toLocaleDateString(\"en-IN\", { day: \"2-digit\", month: \"short\", year: \"numeric\" }),\n        rate: row.effective_rate ? Number(row.effective_rate).toFixed(2) + \"%\" : \"—\",\n        emi: row.emi ? this.inr(row.emi) : \"—\",\n        outcome: OUTCOME[row.outcome] || row.outcome,\n        remove: () => this.db.deleteCheckIn(row.id).then(() => this.loadCheckIns())\n      })),\n      checkInsNote: (s.checkIns || []).length\n        ? \"Your own figures, not ours. Where they disagree with the model, yours are right.\"\n        : \"Nothing logged yet. After your next reset, note what the statement said.\"\n    });\n\n    if (sel) {\n      const sr = this.simulate(sel.start_month, Number(sel.amount), sel.tenure_years, sel.benchmark);\n      // Reconciliation: their statement is ground truth, ours is a model.\n      const latest = (s.checkIns || []).filter(c => c.effective_rate)[0];\n      if (latest) {\n        const obs = new Date(latest.observed_on);\n        const theirs = Number(latest.effective_rate);\n        const ours = this.rateAtMonth(sr, Math.max(this.monthsBetween(sr.start, obs), 0));\n        const realSpread = theirs - this.repoOn(obs);\n        const gap = theirs - ours;\n        Object.assign(v, {\n          hasReconcile: true,\n          recTheirs: theirs.toFixed(2) + \"%\",\n          recOurs: ours.toFixed(2) + \"%\",\n          recSpread: realSpread > 0 ? realSpread.toFixed(2) + \"%\" : \"—\",\n          canApplySpread: realSpread > 0.5 && realSpread < 8,\n          applySpread: () => this.setState({ useOwnSpread: true, ownSpread: realSpread.toFixed(2), screen: \"loan\" }, () => this.compute()),\n          recNote: Math.abs(gap) < 0.06\n            ? \"Within a rounding error. Our assumed spread matches yours, so every figure on your result page holds.\"\n            : \"We were \" + (gap > 0 ? \"under\" : \"over\") + \" by \" + Math.abs(gap).toFixed(2) +\n              \" points, because we assumed a spread rather than knowing it. Yours is the real number — apply it and the whole result recalculates.\"\n        });\n      }\n      const to = Math.min(sr.todayM, sr.series.length - 1);\n      const from = Math.max(to - 12, 0);\n      const months = to - from;\n      const balFrom = sr.series[from].bal, balTo = sr.series[to].bal;\n      const paid = sr.e0 * months;\n      const principalDown = Math.max(balFrom - balTo, 0);\n      const rateFrom = this.rateAtMonth(sr, from), rateTo = this.rateAtMonth(sr, to);\n      const remImplied = this.remMonths(balTo, rateTo, sr.e0);\n      const remPromised = Math.max(sr.n - to, 0);\n      const drift = remImplied === Infinity ? null : remImplied - remPromised;\n      Object.assign(v, {\n        yirWindow: months >= 12\n          ? \"The twelve months to \" + this.mLabel(this.addMonths(sr.start, to)) + \".\"\n          : \"This loan is \" + months + \" months old, so this covers its whole life so far.\",\n        yirRate: rateFrom.toFixed(2) + \"% → \" + rateTo.toFixed(2) + \"%\",\n        yirPaid: this.short(paid),\n        yirInterest: this.short(Math.max(paid - principalDown, 0)),\n        yirPrincipal: this.short(principalDown),\n        yirPosition: drift === null ? \"not clearing\"\n          : (drift > 0 ? \"+\" : \"−\") + Math.abs(drift / 12).toFixed(1) + \" yrs\",\n        yirNote: drift === null\n          ? \"At this rate the EMI barely covers interest, so there is no meaningful schedule position. This is worth a call to your bank.\"\n          : drift > 0\n            ? \"Of every ₹100 you paid this year, about ₹\" + Math.round((Math.max(paid - principalDown, 0) / Math.max(paid, 1)) * 100) + \" went to interest rather than to owning your home.\"\n            : \"You are ahead of the original schedule on an unchanged EMI. Falling rates did that, not anything the bank volunteered.\"\n      });\n    }\n\n    const r = s.result;\n    v.hasResult = !!r;\n    if (!r) return v;\n\n    const extraM = r.payoffM === null ? null : r.payoffM - r.n;\n    const leak = extraM !== null && extraM > 1;\n    const maxM = Math.max(r.payoffM || r.n * 2, r.n) + 2;\n    const promisedEnd = this.addMonths(r.start, r.n);\n    const bal = r.nowBal;\n\n    Object.assign(v, {\n      isLeak: leak,\n      isAhead: extraM !== null && extraM <= 1,\n      leakYears: leak ? (extraM / 12).toFixed(1) : \"0\",\n      aheadYears: extraM !== null && extraM <= 1 ? Math.abs(extraM / 12).toFixed(1) : \"0\",\n      totalYears: (Math.round(((r.payoffM || r.n) / 12) * 10) / 10).toFixed(0),\n      startRate: r.startRate.toFixed(2), nowRate: r.nowRate.toFixed(2),\n      spreadTxt: r.spread.toFixed(2),\n      emiTxt: this.inr(r.e0),\n      balTxt: this.short(bal), promisedBalTxt: this.short(r.promisedNow),\n      paidMonths: r.todayM,\n      payoffTxt: r.payoffM === null ? \"never\" : this.mLabel(this.addMonths(r.start, r.payoffM)),\n      promisedEndTxt: this.mLabel(promisedEnd),\n      extraCashTxt: extraM !== null && extraM > 0 ? this.short(extraM * r.e0) : \"₹0\",\n      overpayPct: extraM !== null && extraM > 0 ? this.overpayPct(r.principal, r.startRate, r.tenureYears, extraM * r.e0).toFixed(0) : \"0\",\n      totalYearsExact: ((r.payoffM || r.n) / 12).toFixed(1),\n      barPromised: (r.payoffM ? (r.n / Math.max(r.payoffM, r.n)) * 100 : 100).toFixed(1),\n      barActual: \"100\",\n      barGap: (r.payoffM ? Math.max((r.payoffM - r.n) / Math.max(r.payoffM, r.n), 0) * 100 : 0).toFixed(1),\n      shareCta: s.shareMsg || \"Copy as text\",\n      copyShare: () => {\n        const txt = \"My home loan, checked against the actual RBI repo history:\\n\\n\"\n          + \"Contracted: \" + s.tenure + \" years\\n\"\n          + \"Actual: \" + ((r.payoffM || r.n) / 12).toFixed(1) + \" years\\n\"\n          + \"EMI: unchanged at \" + this.inr(r.e0) + \" throughout\\n\\n\"\n          + \"The rate cycle added \" + (extraM > 0 ? (extraM / 12).toFixed(1) : \"0\") + \" years to my loan and no statement ever said so.\\n\\n\"\n          + \"Check yours: loanrepo.onrender.com\";\n        if (navigator.clipboard && navigator.clipboard.writeText) {\n          navigator.clipboard.writeText(txt).then(\n            () => this.setState({ shareMsg: \"Copied\" }),\n            () => this.setState({ shareMsg: \"Couldn't copy\" }));\n        }\n        this.db.track(\"share_copied\", {});\n      },\n      chartActual: this.points(r.series, r.principal, maxM),\n      chartPromised: this.points(r.promised, r.principal, maxM),\n      xToday: ((r.todayM / maxM) * 858).toFixed(1),\n      xTodayLabel: Math.min((r.todayM / maxM) * 858 + 6, 800).toFixed(1),\n      yToday: (196 - Math.min(bal / r.principal, 1) * 180).toFixed(1),\n      startLabel: this.mLabel(r.start).toUpperCase(),\n      endLabel: this.mLabel(this.addMonths(r.start, maxM)).toUpperCase(),\n      yTop: this.short(r.principal), yMid: this.short(r.principal / 2),\n      resets: r.resets,\n      resetNote: r.benchmark === \"MCLR\"\n        ? \"MCLR resets annually and is set internally by your bank, so these dates are modelled on a typical annual cycle rather than a published schedule.\"\n        : \"EBLR loans must reset at least quarterly under RBI rules. Only resets that actually changed your rate are listed.\",\n      confidence: r.benchmark === \"MCLR\"\n        ? \"MCLR is set by your bank, not the repo rate directly. This is an approximation using a typical spread and annual reset.\"\n        : \"Modelled on the RBI-mandated quarterly EBLR reset. If your sanction letter says RLLR, that is the same mechanism.\"\n    });\n\n    // The reset date is the borrower's own, derived from disbursal + cycle —\n    // not the MPC date, which is when the decision is made, not when it lands.\n    let k = Math.ceil((r.todayM + 0.001) / r.resetN);\n    const nextResetDate = this.addMonths(r.start, k * r.resetN);\n    const draftLines = [\n      \"Subject: Rate and tenure position on my home loan\",\n      \"\",\n      \"Dear Sir/Madam,\",\n      \"\",\n      \"I hold a floating-rate home loan of \" + this.inr(r.principal) + \" disbursed in \" +\n        this.mLabel(r.start) + \" on an original tenure of \" + r.tenureYears + \" years, currently on \" +\n        r.benchmark + \". My EMI has remained \" + this.inr(r.e0) + \" throughout.\",\n      \"\",\n      \"I would like the following confirmed in writing:\",\n      \"\",\n      \"1. My current effective rate of interest, and the spread I am on over the benchmark.\",\n      \"2. My remaining tenure in months as it stands on your system today.\",\n      \"3. Whether the rate changes since disbursal have been absorbed by my EMI or by my tenure.\",\n      \"4. The cost of resetting my spread to your current card rate for new borrowers.\",\n      (r.benchmark === \"MCLR\"\n        ? \"5. The cost of switching from MCLR to EBLR, and the effective rate after switching.\"\n        : \"5. My reset frequency, and the next date on which my rate is scheduled to reset.\"),\n      \"\",\n      \"For reference, my own calculation against the published repo rate history suggests an effective rate near \" +\n        r.nowRate.toFixed(2) + \"% and an outstanding balance near \" + this.short(bal) +\n        \". I would like to reconcile that against your records.\",\n      \"\",\n      \"Thank you,\",\n      \"[Your name]\",\n      \"[Loan account number]\"\n    ];\n\n    Object.assign(v, {\n      nextReset: this.mLabel(nextResetDate),\n      resetCycle: r.resetN === 12 ? \"annual\" : \"quarterly\",\n      resetsSoFar: Math.floor(r.todayM / r.resetN),\n      draft: draftLines.join(\"\\n\"),\n      copyMsg: s.copyMsg || \"\",\n      copyDraft: () => {\n        const text = draftLines.join(\"\\n\");\n        const done = () => this.setState({ copyMsg: \"Copied.\" });\n        if (navigator.clipboard && navigator.clipboard.writeText) {\n          navigator.clipboard.writeText(text).then(done, () => this.setState({ copyMsg: \"Select the text and copy it manually.\" }));\n        } else { this.setState({ copyMsg: \"Select the text and copy it manually.\" }); }\n        this.db.track(\"draft_copied\", { benchmark: r.benchmark });\n      }\n    });\n\n    // ── payoff routes: arithmetic for each, ranked by nothing ──\n    const remNow = this.remMonths(bal, r.nowRate, r.e0);\n    const lump = Math.max(Math.min(Number(s.payoffLump) || 0, bal), 0);\n    const extra = Math.max(Number(s.payoffExtra) || 0, 0);\n    const baseM = remNow === Infinity ? null : remNow;\n\n    const route = (name, note, emiOut, lumpNow) => {\n      const b = Math.max(bal - lumpNow, 0);\n      if (b <= 0) return { name, note, outgo: \"—\", clears: \"now\", delta: \"—\", total: this.short(lumpNow) };\n      const m = this.remMonths(b, r.nowRate, emiOut);\n      if (m === Infinity) return { name, note, outgo: this.inr(emiOut), clears: \"never\", delta: \"—\", total: \"—\" };\n      const d = baseM === null ? null : (baseM - m) / 12;\n      return {\n        name, note,\n        outgo: this.inr(emiOut),\n        clears: this.mLabel(this.addMonths(Component.TODAY, Math.round(m))),\n        delta: d === null ? \"—\" : (d > 0.05 ? \"−\" : d < -0.05 ? \"+\" : \"\") + Math.abs(d).toFixed(1) + \" yrs\",\n        total: this.short(m * emiOut + lumpNow)\n      };\n    };\n\n    const routes = [\n      route(\"Change nothing\", \"The loan as it stands today\", r.e0, 0),\n      route(\"Lump sum, keep the EMI\", this.short(lump) + \" in now, term shortens\", r.e0, lump),\n      route(\"Lump sum, cut the EMI\", this.short(lump) + \" in now, term unchanged\",\n        baseM === null ? r.e0 : this.emi(Math.max(bal - lump, 0), r.nowRate, Math.max(Math.round(baseM), 1)), lump),\n      route(\"Add to every EMI\", this.inr(extra) + \" extra each month, no lump sum\", r.e0 + extra, 0),\n      route(\"Both\", \"Lump sum now and a bigger EMI after\", r.e0 + extra, lump)\n    ];\n    // The \"cut the EMI\" row ends on the original date by construction; label it.\n    if (baseM !== null) routes[2].delta = \"0.0 yrs\";\n\n    Object.assign(v, {\n      routes,\n      fLump: s.payoffLump, fExtra: s.payoffExtra,\n      setLump: e => this.setState({ payoffLump: e.target.value }),\n      setExtra: e => this.setState({ payoffExtra: e.target.value })\n    });\n    return v;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
