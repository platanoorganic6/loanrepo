<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoanRepo — Your personalised guide</title><script src="./supabase-config.js"></script><style>body{font-family:system-ui,sans-serif;color:#1d2d3d;max-width:640px;margin:80px auto;padding:24px;line-height:1.6}h1{line-height:1.1}.muted{color:#5d6872}</style></head><body><p>LoanRepo · The Quiet Years</p><h1>Preparing your personalised Borrower's Guide…</h1><p class="muted" id="msg">Checking your secure purchase link.</p><script>(function(){var token=new URLSearchParams(location.search).get("access");var msg=document.getElementById("msg");if(!token){msg.textContent="This link is missing its secure access token.";return;}var cfg=window.LOANREPO_SUPABASE||{};fetch(cfg.url.replace(/\/$/,"")+"/functions/v1/ebook-access",{method:"POST",headers:{"Content-Type":"application/json","apikey":cfg.anonKey},body:JSON.stringify({token:token})}).then(function(r){return r.json().then(function(d){return{ok:r.ok,d:d};});}).then(function(x){if(!x.ok||!x.d||!x.d.ok){msg.textContent="This secure link may have expired. Ebook links are valid for 14 days.";return;}var p=x.d.loanQuery||{};var q=new URLSearchParams();Object.keys(p).forEach(function(k){if(p[k]!==undefined&&p[k]!==null&&String(p[k])!=="")q.set(k,String(p[k]));});location.replace("Ebook.html?"+q.toString());}).catch(function(){msg.textContent="We could not reach the secure delivery service. Please try again in a moment.";});})();</script></body></html>
